<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
      // Before first paint: until data-view exists no pane rule matches, and both panes show.
      // Precedence: the frontmatter unit (no preview) > URL `?view=` > localStorage > viewport. A
      // remembered preview-only mode is not restored: reading has its own page (D60).
      (() => {
        const q = new URLSearchParams(location.search);
        const known = v => v === 'edit' || v === 'split' || v === 'preview';
        const url = q.get('view');
        const kept = localStorage.getItem('vault.view-mode');
        document.documentElement.dataset.view = q.has('frontmatter')
          ? 'edit'
          : known(url)
            ? url
            : known(kept) && kept !== 'preview'
              ? kept
              : innerWidth >= 768
                ? 'split'
                : 'edit';
      })();
    </script>
    <script>
      // api() adopts these by exact URL: keep them in step with the page's own first requests.
      (() => {
        performance.mark('head script');
        const token = localStorage.getItem('vault.token');
        const q = new URLSearchParams(location.search);
        const path = q.get('path');
        if (!token || !path) return;
        const at = `/vault/${path.split('/').map(encodeURIComponent).join('/')}`;
        const n = Number(q.get('n'));
        const occurrence = Number.isSafeInteger(n) && n > 0 ? n : 0;
        const urls = [
          q.has('section')
            ? `${at}?section=${encodeURIComponent(q.get('section').trim())}&occurrence=${occurrence}`
            : q.has('frontmatter')
              ? `${at}?frontmatter=yaml`
              : at
        ];
        const early = (window.__early ??= new Map());
        for (const url of urls) {
          const res = fetch(url, {headers: {Authorization: `Bearer ${token}`}});
          res.catch(() => {});
          early.set(url, res);
        }
      })();
    </script>
    <title>vault-storage — edit</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        flex-shrink: 0;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
        background: var(--card);
      }
      .toolbar .path {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 0.85rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.55rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-family: var(--mono);
        background: rgba(127, 127, 127, 0.12);
        color: var(--muted);
      }
      .pill.editing {
        color: var(--muted);
      }
      .pill.saving {
        color: var(--accent);
      }
      .pill.saved {
        color: var(--ok);
      }
      .pill.offline {
        color: var(--bad);
      }
      .pill .spinner {
        width: 0.7em;
        height: 0.7em;
        border-width: 1.5px;
      }
      .spinner {
        border-top-color: currentColor;
      }
      .toolbar .modes button {
        padding: 0.35rem 0.7rem;
        font-size: 0.8rem;
        font-weight: 400;
      }
      /* Underline, never a fill: the group sits on --card, so filling the
         active button made it blend in and the inactive ones read as raised. */
      .toolbar .modes button[aria-pressed='true'] {
        background: transparent;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-thickness: 2px;
      }
      :root[data-unit='frontmatter'] .toolbar .modes {
        display: none;
      }
      @media (max-width: 767px) {
        .toolbar .path {
          flex-basis: 100%;
        }
        .toolbar .modes button[data-value='split'] {
          display: none;
        }
      }
      #notice {
        flex-shrink: 0;
        margin: 0;
        border-radius: 0;
        border-width: 0 0 1px;
      }
      #notice button {
        margin-left: 0.4rem;
        padding: 0.2rem 0.6rem;
        font-size: 0.85rem;
      }
      .err {
        border: 0;
        border-bottom: 1px solid var(--bad);
        border-radius: 0;
        flex-shrink: 0;
        font-size: 0.9rem;
      }
      main {
        padding: 0;
        max-width: none;
        margin: 0;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .panes {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .edit-pane {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .unit {
        padding: 0.5rem 1rem 0;
        font-family: var(--mono);
        font-size: 0.9rem;
        color: var(--muted);
      }
      #editor {
        flex: 1;
        min-height: 0;
        width: 100%;
        padding: 1rem;
        border: 0;
        resize: none;
        outline: none;
        font-family: var(--mono);
        font-size: 0.9rem;
        line-height: 1.55;
        background: var(--bg);
        color: var(--fg);
        tab-size: 2;
      }
      .preview {
        flex: 1;
        min-width: 0;
        min-height: 0;
        padding: 1rem 1.2rem;
        overflow-y: auto;
        border-left: 1px solid var(--line);
        background: var(--card);
      }
      :root[data-view='edit'] .preview {
        display: none;
      }
      :root[data-view='preview'] .edit-pane {
        display: none;
      }
      :root[data-view='preview'] .preview {
        border-left: 0;
      }
      .preview-gate button {
        margin-top: 0.6rem;
      }
      @media (max-width: 767px) {
        :root[data-view='split'] .preview {
          display: none;
        }
      }
      .find-bar {
        position: absolute;
        top: 0.5rem;
        right: 0.9rem;
        z-index: 6;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.5rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
      }
      .find-bar[hidden] {
        display: none;
      }
      .find-row {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        flex-wrap: wrap;
      }
      .find-bar input[type='text'] {
        width: 14rem;
        padding: 0.35rem 0.5rem;
        font: inherit;
        font-size: 0.85rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        background: var(--bg);
        color: var(--fg);
      }
      .find-bar input.no-match {
        border-color: var(--bad);
      }
      .find-bar button {
        padding: 0.3rem 0.5rem;
        font-size: 0.8rem;
        line-height: 1;
      }
      .find-bar button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .find-count {
        min-width: 4rem;
        font-size: 0.75rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      @media (max-width: 600px) {
        .find-bar {
          left: 0.6rem;
          right: 0.6rem;
          top: 0.4rem;
        }
        .find-bar input[type='text'] {
          width: 100%;
          flex: 1;
        }
      }
      .insert-row {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(var(--kb-offset, 0px) + env(safe-area-inset-bottom));
        background: var(--card);
        border-top: 1px solid var(--line);
        padding: 0.35rem 0.5rem;
        gap: 0.3rem;
        overflow-x: auto;
        z-index: 10;
        -webkit-user-select: none;
        user-select: none;
      }
      .insert-row button {
        flex-shrink: 0;
        min-width: 2.4rem;
        padding: 0.55rem 0.65rem;
        font-family: var(--mono);
        font-size: 0.9rem;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        color: var(--fg);
        cursor: pointer;
      }
      .insert-row button:active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      @media (max-width: 767px) {
        body[data-editor-focused] .insert-row {
          display: flex;
        }
        body[data-editor-focused] #editor {
          padding-bottom: 4rem;
        }
      }
      dialog#recent-dlg,
      dialog#wiki-dlg {
        max-width: 36rem;
        width: 90vw;
      }
      dialog .fmw-records {
        margin: 0 0 0.8rem;
        max-height: 60vh;
        overflow-y: auto;
      }
      .wiki-search {
        width: 100%;
        padding: 0.55rem 0.7rem;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        background: var(--bg);
        color: var(--fg);
        margin-bottom: 0.6rem;
      }
      #wiki-results a.active,
      #wiki-results a:hover {
        background: rgba(127, 127, 127, 0.18);
      }
      #wiki-results small {
        word-break: break-all;
      }
      .snippet {
        font-size: 0.8rem;
        color: var(--muted);
        word-break: break-word;
      }
    </style>

  <body class="fmw">
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <vault-toolbar class="toolbar" id="toolbar">
      <button id="save" class="primary" disabled title="Save (⌘S)">Save</button>
      <button id="discard" hidden title="Drop your changes and the draft">Discard</button>
      <button id="view" hidden title="Read the rendered note">View</button>
      <button id="wiki-pick" title="Insert wikilink (search the vault)">[[…]]</button>
      <button id="outline" title="Outline (jump to heading)">Outline</button>
      <button id="find-btn" title="Find / replace (⌘F)">Find</button>
      <button id="recent" hidden>Recent</button>
      <button id="del" class="danger" hidden>Delete</button>
    </vault-toolbar>
    <div class="err" id="err" hidden></div>
    <div class="fmw-notice" id="notice" hidden></div>
    <main>
      <div id="find-bar" class="find-bar" hidden role="search" aria-label="Find and replace">
        <div class="find-row">
          <input
            id="find-input"
            type="text"
            placeholder="Find"
            autocomplete="off"
            spellcheck="false"
          />
          <span id="find-count" class="find-count" aria-live="polite"></span>
          <button id="find-prev" type="button" title="Previous match (⇧⏎)">↑</button>
          <button id="find-next" type="button" title="Next match (⏎)">↓</button>
          <button id="find-case" type="button" aria-pressed="false" title="Match case">Aa</button>
          <button id="find-close" type="button" title="Close (Esc)">✕</button>
        </div>
        <div class="find-row">

    <dialog id="del-dlg">
      <h2>Delete this note?</h2>
      <p>This removes the file from the vault. The UI cannot undo it.</p>

    <dialog id="discard-dlg">
      <h2>Discard your changes?</h2>
      <p>This drops the text in the editor and its draft, and shows what the note holds now.</p>
      <div class="row">

        <button id="discard-confirm" class="danger primary">Discard</button>

    <dialog id="recent-dlg">

    <dialog id="wiki-dlg">

        spellcheck="false"
        class="wiki-search"

    <dialog id="outline-dlg">
      <h2>Outline</h2>
      <p id="outline-count"></p>
      <div id="outline-list" class="fmw-records"></div>
      <div class="row">
        <button id="outline-close">Close</button>
      </div>
    </dialog>

    <script type="module">
      import {mark, perfOn, time, timeAsync} from '/ui/perf.js';
      import '/ui/components/vault-toolbar.js';
      import {api, apiJson, esc, existingPaths, getToken, showAuthDialog} from '/ui/api.js';

      const DRAFT_DEBOUNCE_MS = 1500;
      const PREVIEW_DEBOUNCE_MS = 300;
      const PREVIEW_AUTO_MAX_CHARS = 100_000;
      const $ = sel => document.querySelector(sel);
      const editor = $('#editor');
      const toolbar = $('#toolbar');
      const params = new URLSearchParams(location.search);

      const STARTER_TEMPLATE = `---
title: ""
type: fleeting
status: active
tags: []
ready: false
---

`;

      const pad = n => String(n).padStart(2, '0');
      const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const newCapturePath = () => {
        const d = new Date();
        return `raw/${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.md`;
      };
      const encodePath = p => p.split('/').map(encodeURIComponent).join('/');
      const etagOf = res => (res.headers.get('ETag') ?? '').replace(/^W\//, '').replace(/"/g, '');

      const unitFromUrl = () => {
        if (params.has('section')) {
          const n = Number(params.get('n'));
          return {
            kind: 'section',
            heading: params.get('section').trim(),
            occurrence: Number.isSafeInteger(n) && n > 0 ? n : 0
          };
        }
        return params.has('frontmatter') ? {kind: 'frontmatter'} : {kind: 'document'};
      };

      // state -----------------------------------------------------------
      const state = {
        path: params.get('path'),
        unit: unitFromUrl(),
        isNew: false,
        // What the edit started from: the unit's hash, or the document's ETag.
        baseHash: '',
        serverText: '',
        dirty: false,
        draftId: null,
        draftText: null,
        draftTimer: null,
        lastSavedAt: null
      };
      document.documentElement.dataset.unit = state.unit.kind;

      const setStatus = (kind, label) => toolbar.setStatus(kind, label);
      const unitName = unit =>
        unit.kind === 'section'
          ? unit.heading + (unit.occurrence ? ` (occurrence ${unit.occurrence + 1})` : '')
          : unit.kind === 'frontmatter'
            ? 'the frontmatter'
            : 'the whole note';

      const showError = msg => {
        $('#err').textContent = msg;
        $('#err').hidden = false;
      };
      const hideError = () => {
        $('#err').hidden = true;
      };
      const showNotice = html => {
        $('#notice').innerHTML = html;
        $('#notice').hidden = false;
      };
      const hideNotice = () => {
        $('#notice').hidden = true;
      };

      const reflectDirty = () => {
        state.dirty = state.isNew || editor.value !== state.serverText;
        $('#save').disabled = !state.dirty;
        $('#discard').hidden = !state.dirty || state.isNew;
      };

      // drafts ------------------------------------------------------------
      const sameUnit = (a, b) =>
        a.kind === b.kind &&
        (a.kind !== 'section' || (a.heading === b.heading && a.occurrence === b.occurrence));

      async function keepDraft() {
        clearTimeout(state.draftTimer);
        state.draftTimer = null;
        const text = editor.value;
        if (!state.dirty || text === state.draftText) return;
        try {
          const draft = await apiJson('/drafts', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              path: state.path,
              unit: state.unit,
              base_hash: state.baseHash,
              text
            })
          });
          state.draftId = draft.id;
          state.draftText = text;
          if (state.dirty) setStatus('editing', `unsaved; draft kept ${fmtTime(new Date())}`);
        } catch {
          setStatus('offline', 'draft not kept');
        }
      }

      async function dropDraft() {
        const id = state.draftId;
        state.draftId = null;
        state.draftText = null;
        if (!id) return;
        try {
          await api(`/drafts/${id}`, {method: 'DELETE'});
        } catch {
          // Already gone is the outcome wanted.
        }
      }

      const offerDraft = draft => {
        state.draftId = draft.id;
        state.draftText = draft.text;
        const stale =
          draft.base_hash !== state.baseHash
            ? ' The note changed after this draft began, so saving it replaces those changes.'
            : '';
        showNotice(
          `An unsaved draft of ${esc(unitName(state.unit))} from ${esc(fmtTime(new Date(draft.updated)))} is kept on the server.${stale}` +
            '<button data-action="restore">Restore it</button><button data-action="drop">Discard it</button>'
        );
      };

      // load ------------------------------------------------------------
      const fill = text => {
        time('editor: fill', () => (editor.value = text), `${text.length} chars`);
        if (perfOn) time('editor: forced layout', () => editor.getBoundingClientRect().height);
      };

      async function readUnit() {
        const at = `/vault/${encodePath(state.path)}`;
        const {unit} = state;
        if (unit.kind === 'section') {
          const r = await apiJson(
            `${at}?section=${encodeURIComponent(unit.heading)}&occurrence=${unit.occurrence}`
          );
          return {text: r.content, hash: r.hash};
        }
        if (unit.kind === 'frontmatter') {
          const r = await apiJson(`${at}?frontmatter=yaml`);
          return {text: r.frontmatter, hash: r.hash};
        }
        const res = await api(at);
        return {text: await res.text(), hash: etagOf(res)};
      }

      async function load() {
        hideError();
        hideNotice();
        if (!getToken()) {
          showAuthDialog();
          return;
        }
        if (!state.path) return startNew(newCapturePath());
        toolbar.path =
          state.unit.kind === 'document' ? state.path : `${state.path} · ${unitName(state.unit)}`;
        document.title = `vault-storage — edit ${state.path}`;
        if (state.unit.kind === 'section') {
          $('#unit').textContent = state.unit.heading;
          $('#unit').hidden = false;
        }
        setStatus('saving', 'loading…');
        let loaded;
        try {
          loaded = await timeAsync('load: read', () => readUnit());
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') return showAuthDialog();
          if (e.status === 404 && params.has('new')) return startNew(state.path);
          setStatus('offline', 'not loaded');
          showError(`Failed to load ${unitName(state.unit)} of ${state.path}: ${e.message}`);
          return;
        }
        state.isNew = false;
        state.serverText = loaded.text;
        state.baseHash = loaded.hash;
        fill(loaded.text);
        editor.disabled = false;
        $('#view').hidden = false;
        $('#del').hidden = state.unit.kind !== 'document';
        reflectDirty();
        setStatus('saved', `loaded ${fmtTime(new Date())}`);
        schedulePreview();
        await checkDrafts();
        mark('load: done');
      }

      async function checkDrafts() {
        try {
          const {items} = await apiJson(`/drafts?path=${encodeURIComponent(state.path)}`);
          const draft = items.find(d => sameUnit(d.unit, state.unit));
          if (draft && draft.text !== editor.value) offerDraft(draft);
        } catch {
          // No drafts to offer is the same page either way.
        }
      }

      function startNew(path) {
        state.path = path;
        state.unit = {kind: 'document'};
        state.isNew = true;
        state.serverText = '';
        state.baseHash = '';
        history.replaceState(null, '', `?path=${encodeURIComponent(path)}&new=1`);
        toolbar.path = `${path} (new)`;
        document.title = 'vault-storage — new note';
        $('#recent').hidden = false;
        fill(STARTER_TEMPLATE);
        editor.disabled = false;
        reflectDirty();
        setStatus('editing', 'new note');
        editor.focus();
        editor.setSelectionRange(editor.value.length, editor.value.length);
        checkDrafts().then(offerOrphans);
      }

      // Unsaved new notes left behind by an earlier page: drafts of paths not yet in the vault.
      async function offerOrphans() {
        if (!$('#notice').hidden) return;
        try {
          const {items} = await apiJson('/drafts');
          const candidates = items.filter(
            d => d.unit.kind === 'document' && d.path.startsWith('raw/') && d.path !== state.path
          );
          if (!candidates.length) return;
          const exist = await existingPaths(candidates.map(d => d.path));
          const orphans = candidates.filter(d => !exist.has(d.path)).slice(0, 5);
          if (!orphans.length) return;
          showNotice(
            'Unsaved new notes from earlier: ' +
              orphans
                .map(
                  d =>
                    `<a href="/ui/edit.html?path=${encodeURIComponent(d.path)}&new=1">${esc(d.path)}</a> (${esc(fmtTime(new Date(d.updated)))})`
                )
                .join(', ') +
              '.'
          );
        } catch {
          // Nothing to offer.
        }
      }

      // save ------------------------------------------------------------
      async function writeUnit(text, force) {
        const at = `/vault/${encodePath(state.path)}`;
        const {unit} = state;
        const guard = force ? {} : {expected_hash: state.baseHash};
        const edit = payload =>
          apiJson('/vault/edit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({path: state.path, ...payload, ...guard})
          });
        if (unit.kind === 'section') {
          const r = await edit({
            op: 'replace-section',
            heading: unit.heading,
            occurrence: unit.occurrence,
            body: text
          });
          return {hash: r.hash, text};
        }
        if (unit.kind === 'frontmatter') {
          const r = await edit({op: 'replace-frontmatter', yaml: text});
          // The server writes its own serialization and stamps `updated`; show what it wrote.
          const fresh = await apiJson(`${at}?frontmatter=yaml`);
          return {hash: r.hash, text: fresh.hash === r.hash ? fresh.frontmatter : text};
        }
        const headers = {'Content-Type': 'text/markdown'};
        if (!force && !state.isNew) headers['If-Match'] = `"${state.baseHash}"`;
        const res = await api(`${at}?frontmatter=replace`, {method: 'PUT', headers, body: text});
        return {hash: etagOf(res), text};
      }

      const isConflict = e =>
        e.status === 412 ||
        (e.status === 409 && (e.code === 'section_changed' || e.code === 'frontmatter_changed'));

      async function save(force = false) {
        if (!state.dirty && !force) return;
        const text = editor.value;
        setStatus('saving', '');
        hideNotice();
        try {
          const saved = await writeUnit(text, force);
          const created = state.isNew;
          state.isNew = false;
          state.baseHash = saved.hash;
          state.serverText = saved.text;
          if (saved.text !== text && editor.value === text) editor.value = saved.text;
          state.lastSavedAt = new Date();
          await dropDraft();
          reflectDirty();
          setStatus('saved', `saved ${fmtTime(state.lastSavedAt)}`);
          hideError();
          if (created) {
            history.replaceState(null, '', `?path=${encodeURIComponent(state.path)}`);
            toolbar.path = state.path;
            document.title = `vault-storage — edit ${state.path}`;
            $('#view').hidden = false;
            $('#del').hidden = false;
            $('#recent').hidden = true;
          }
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') return showAuthDialog();
          await keepDraft();
          setStatus('offline', 'not saved');
          if (isConflict(e)) {
            showNotice(
              `${esc(unitName(state.unit))} changed on the server since you opened it. Your text is kept as a draft.` +
                '<button data-action="reload">Load the server’s version</button><button data-action="force">Save mine anyway</button>'
            );
            return;
          }
          showError(`Save failed: ${e.message}`);
        }
      }

      async function discard() {
        clearTimeout(state.draftTimer);
        state.draftTimer = null;
        await dropDraft();
        editor.value = state.serverText;
        reflectDirty();
        hideNotice();
        setStatus('saved', 'changes discarded');
        schedulePreview();
      }

      $('#notice').addEventListener('click', async e => {
        const action = e.target.closest('button[data-action]')?.dataset.action;
        if (!action) return;
        hideNotice();
        if (action === 'restore') {
          editor.value = state.draftText ?? editor.value;
          reflectDirty();
          setStatus('editing', 'draft restored; not saved');
          schedulePreview();
        } else if (action === 'drop') {
          await dropDraft();
        } else if (action === 'reload') {
          await load();
        } else if (action === 'force') {
          await save(true);
        }
      });

      async function del() {
        try {
          await api(`/vault/${encodePath(state.path)}`, {method: 'DELETE'});
          await dropDraft();
          state.dirty = false;
          location.href = '/ui/projects.html';
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') return showAuthDialog();
          showError(`Delete failed: ${e.message}`);
        }
      }

      // edit ------------------------------------------------------------
      editor.addEventListener('input', () => {
        reflectDirty();
        if (state.dirty) {
          setStatus('editing', 'unsaved');
          clearTimeout(state.draftTimer);
          state.draftTimer = setTimeout(keepDraft, DRAFT_DEBOUNCE_MS);
        } else {
          setStatus(
            'saved',
            state.lastSavedAt ? `saved ${fmtTime(state.lastSavedAt)}` : 'no changes'
          );
        }
        previewManual = false;
        schedulePreview();
        if (!$('#find-bar').hidden) recomputeFind();
      });

      // execCommand keeps the edit on the textarea's own undo stack; setRangeText is the fallback.
      const insertText = text => {
        editor.focus();
        if (!document.execCommand('insertText', false, text)) {
          editor.setRangeText(text, editor.selectionStart, editor.selectionEnd, 'end');
          editor.dispatchEvent(new Event('input', {bubbles: true}));
        }
      };

      const insertWrap = (open, close) => {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const tail = close ?? open;
        const selected = editor.value.slice(start, end);
        insertText(open + selected + tail);
        if (selected) editor.setSelectionRange(start, end + open.length + tail.length);
        else editor.setSelectionRange(start + open.length, start + open.length);
      };

      const insertPrefix = prefix => {
        const cursor = editor.selectionStart;
        const lineStart = editor.value.lastIndexOf('\n', cursor - 1) + 1;
        editor.setSelectionRange(lineStart, lineStart);
        insertText(prefix);
        editor.setSelectionRange(cursor + prefix.length, cursor + prefix.length);
      };

      // Blur and refocus: the engines scroll a textarea to its caret on focus.
      const jumpTo = (start, end = start) => {
        editor.focus();
        editor.setSelectionRange(start, end);
        editor.blur();
        editor.focus();
      };

      // Spellcheck stays off until someone edits: checking a large body can cost more than the load.
      const armSpellcheck = () => {
        if (!editor.spellcheck) time('editor: spellcheck on', () => (editor.spellcheck = true));
      };
      for (const evt of ['pointerdown', 'keydown']) {
        editor.addEventListener(evt, armSpellcheck, {once: true});
      }

      editor.addEventListener('focus', () => {
        document.body.dataset.editorFocused = '1';
      });
      editor.addEventListener('blur', () => {
        delete document.body.dataset.editorFocused;
      });

      // preview ---------------------------------------------------------
      let viewMode = document.documentElement.dataset.view;
      let previewTimer = null;
      let previewTicket = 0;
      let previewManual = false;
      let previewRendered = false;
      const narrow = window.matchMedia('(max-width: 767px)');
      const previewOnScreen = () =>
        state.unit.kind !== 'frontmatter' &&
        (viewMode === 'preview' || (viewMode === 'split' && !narrow.matches));

      const fmtCount = n =>
        n < 1000
          ? `${n}`
          : n < 1_000_000
            ? `${Math.round(n / 1000)}K`
            : `${(n / 1_000_000).toFixed(1)}M`;

      const splitFrontmatter = text => {
        const end = text.startsWith('---\n') ? text.indexOf('\n---', 4) : -1;
        if (end < 0) return {yaml: null, body: text};
        const after = end + 4;
        return {
          yaml: text.slice(4, end),
          body: text.slice(text[after] === '\n' ? after + 1 : after)
        };
      };

      // The server renders (D60): the browser's own regex engine took 45 s on a large note.
      const renderPreview = async text => {
        previewRendered = text.length > 0;
        $('#preview-gate').hidden = true;
        $('#preview').hidden = false;
        const ticket = ++previewTicket;
        const {yaml, body} =
          state.unit.kind === 'section'
            ? {yaml: null, body: `${state.unit.heading}\n\n${text}`}
            : splitFrontmatter(text);
        try {
          const res = await timeAsync('preview: server render', () =>
            api('/vault/render', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({markdown: body})
            })
          );
          const {html} = await res.json();
          if (ticket !== previewTicket) return;
          const fm = yaml === null ? '' : `<pre class="frontmatter">${esc(yaml)}</pre>`;
          time(
            'preview: insert',
            () => ($('#preview').innerHTML = fm + html),
            `${html.length} chars`
          );
        } catch (e) {
          if (ticket !== previewTicket) return;
          $('#preview').innerHTML = `<p class="fmw-notice">Preview failed: ${esc(e.message)}</p>`;
        }
      };

      // Laying out a large rendered note takes most of a second on a slow engine, so above the
      // threshold a render per typing pause is the writer's to ask for.
      const armPreviewGate = chars => {
        $('#preview-gate-text').textContent = previewRendered
          ? `Preview is out of date. This text is ${fmtCount(chars)} characters; re-render it to see the change.`
          : `Preview is off above ${fmtCount(PREVIEW_AUTO_MAX_CHARS)} characters. This text is ${fmtCount(chars)}.`;
        $('#preview-render').textContent = previewRendered ? 'Re-render' : 'Render preview';
        $('#preview').hidden = true;
        $('#preview-gate').hidden = false;
      };

      const schedulePreview = () => {
        if (!previewOnScreen()) return;
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => {
          const text = editor.value;
          if (!previewManual && text.length > PREVIEW_AUTO_MAX_CHARS) {
            armPreviewGate(text.length);
            return;
          }
          renderPreview(text);
        }, PREVIEW_DEBOUNCE_MS);
      };

      $('#preview-render').addEventListener('click', () => {
        previewManual = true;
        renderPreview(editor.value);
      });

      toolbar.addEventListener('mode-change', e => {
        viewMode = e.detail.mode;
        localStorage.setItem('vault.view-mode', viewMode);
        document.documentElement.dataset.view = viewMode;
        toolbar.mode = viewMode;
        schedulePreview();
      });
      toolbar.mode = viewMode;
      narrow.addEventListener('change', schedulePreview);

      // outline ---------------------------------------------------------
      const parseHeadings = text => {
        const lines = text.split('\n');
        const headings = [];
        let inFence = false;
        let offset = 0;
        let i = 0;
        if (lines[0] === '---') {
          offset = 4;
          for (i = 1; i < lines.length && lines[i] !== '---'; ++i) offset += lines[i].length + 1;
          offset += 4;
          ++i;
        }
        for (; i < lines.length; ++i) {
          const line = lines[i];
          if (line.startsWith('```')) inFence = !inFence;
          else if (!inFence) {
            const m = /^(#{1,6})\s+(.+?)\s*$/.exec(line);
            if (m) headings.push({level: m[1].length, text: m[2], offset});
          }
          offset += line.length + 1;
        }
        return headings;
      };

      const openOutline = () => {
        const headings = parseHeadings(editor.value);
        $('#outline-count').textContent = headings.length
          ? `${headings.length} heading${headings.length === 1 ? '' : 's'}.`
          : 'No headings in this text.';
        $('#outline-list').innerHTML = headings
          .map(
            h =>
              `<a href="#" data-offset="${h.offset}" style="padding-left: ${(h.level - 1) * 1.2 + 0.7}rem"><b>${esc(h.text)}</b><small>H${h.level}</small></a>`
          )
          .join('');
        $('#outline-dlg').showModal();
      };

      $('#outline-list').addEventListener('click', e => {
        const item = e.target.closest('a[data-offset]');
        if (!item) return;
        e.preventDefault();
        $('#outline-dlg').close();
        jumpTo(Number(item.dataset.offset));
      });

      // find / replace --------------------------------------------------
      const find = {matches: [], idx: -1, caseSensitive: false, anchor: 0};

      const findAll = (hay, needle) => {
        const out = [];
        if (!needle) return out;
        let h = hay;
        let n = needle;
        if (!find.caseSensitive) {
          const lower = hay.toLowerCase();
          // A case fold that changes the length would shift every offset.
          if (lower.length === hay.length) {
            h = lower;
            n = needle.toLowerCase();
          }
        }
        for (let at = h.indexOf(n); at >= 0; at = h.indexOf(n, at + n.length)) out.push(at);
        return out;
      };

      const updateFindUI = () => {
        const n = find.matches.length;
        const q = $('#find-input').value;
        $('#find-count').textContent = n ? `${find.idx + 1}/${n}` : q ? 'no results' : '';
        for (const id of ['#find-prev', '#find-next', '#replace-one', '#replace-all']) {
          $(id).disabled = n === 0;
        }
        $('#find-input').classList.toggle('no-match', !!q && n === 0);
      };

      const selectMatch = () => {
        if (find.idx < 0) return;
        const start = find.matches[find.idx];
        const back = document.activeElement;
        jumpTo(start, start + $('#find-input').value.length);
        if (back && back !== editor) back.focus();
      };

      const recomputeFind = () => {
        find.matches = findAll(editor.value, $('#find-input').value);
        const at = find.matches.findIndex(s => s >= find.anchor);
        find.idx = find.matches.length ? (at >= 0 ? at : 0) : -1;
        updateFindUI();
      };

      const stepFind = dir => {
        const n = find.matches.length;
        if (!n) return;
        find.idx = (find.idx + dir + n) % n;
        find.anchor = find.matches[find.idx];
        updateFindUI();
        selectMatch();
      };

      const replaceOne = () => {
        if (find.idx < 0) return;
        const start = find.matches[find.idx];
        editor.setSelectionRange(start, start + $('#find-input').value.length);
        insertText($('#replace-input').value);
        find.anchor = start + $('#replace-input').value.length;
        recomputeFind();
        $('#replace-input').focus();
      };

      const replaceAll = () => {
        const q = $('#find-input').value;
        const matches = findAll(editor.value, q);
        if (!matches.length) return;
        const rep = $('#replace-input').value;
        let out = '';
        let prev = 0;
        for (const s of matches) {
          out += editor.value.slice(prev, s) + rep;
          prev = s + q.length;
        }
        editor.setSelectionRange(0, editor.value.length);
        insertText(out + editor.value.slice(prev));
        find.anchor = 0;
        recomputeFind();
        $('#find-count').textContent = `${matches.length} replaced`;
      };

      const openFind = () => {
        const sel = editor.value.slice(editor.selectionStart, editor.selectionEnd);
        if (sel && !sel.includes('\n')) $('#find-input').value = sel;
        find.anchor = editor.selectionStart || 0;
        $('#find-bar').hidden = false;
        recomputeFind();
        $('#find-input').focus();
        $('#find-input').select();
      };

      const closeFind = () => {
        if ($('#find-bar').hidden) return;
        $('#find-bar').hidden = true;
        $('#find-input').classList.remove('no-match');
        if (find.idx >= 0) {
          const start = find.matches[find.idx];
          jumpTo(start, start + $('#find-input').value.length);
        } else {
          editor.focus();
        }
      };

      $('#find-input').addEventListener('input', recomputeFind);
      $('#find-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          stepFind(e.shiftKey ? -1 : 1);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeFind();
        }
      });
      $('#replace-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          replaceOne();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeFind();
        }
      });
      $('#find-next').addEventListener('click', () => stepFind(1));
      $('#find-prev').addEventListener('click', () => stepFind(-1));
      $('#replace-one').addEventListener('click', replaceOne);
      $('#replace-all').addEventListener('click', replaceAll);
      $('#find-close').addEventListener('click', closeFind);
      $('#find-case').addEventListener('click', () => {
        find.caseSensitive = !find.caseSensitive;
        $('#find-case').setAttribute('aria-pressed', String(find.caseSensitive));
        recomputeFind();
      });
      $('#find-bar').addEventListener('mousedown', e => {
        if (e.target.closest('button')) e.preventDefault();
      });

      // wikilink picker -------------------------------------------------
      let wikiResults = [];
      let wikiSelected = -1;
      let wikiTimer = null;
      let wikiAbort = null;

      const insertWikilink = path => {
        $('#wiki-dlg').close();
        insertText(`[[${path.replace(/\.md$/, '')}]]`);
      };

      const renderWikiResults = () => {
        $('#wiki-results').innerHTML = wikiResults.length
          ? wikiResults
              .map(
                (r, i) =>
                  `<a href="#" class="${i === wikiSelected ? 'active' : ''}" data-idx="${i}"><b>${esc(r.title)}</b><small>${esc(r.filename)}</small>${r.snippet ? `<span class="snippet">… ${esc(r.snippet)} …</span>` : ''}</a>`
              )
              .join('')
          : '<div class="empty">No matches.</div>';
        $('#wiki-results a.active')?.scrollIntoView({block: 'nearest'});
      };

      const wikiSearch = async q => {
        wikiAbort?.abort();
        wikiAbort = new AbortController();
        try {
          const data = await apiJson(`/search/simple/?${new URLSearchParams({query: q})}`, {
            method: 'POST',
            signal: wikiAbort.signal
          });
          wikiResults = (Array.isArray(data) ? data : [])
            .filter(r => r.filename !== state.path)
            .slice(0, 10)
            .map(r => ({
              filename: r.filename,
              title: r.filename.split('/').pop().replace(/\.md$/, ''),
              snippet: r.matches?.[0]?.context ?? null
            }));
          wikiSelected = wikiResults.length ? 0 : -1;
          renderWikiResults();
        } catch (e) {
          if (e.name === 'AbortError') return;
          $('#wiki-results').innerHTML =
            `<div class="empty">Search failed: ${esc(e.message)}</div>`;
        }
      };

      $('#wiki-pick').addEventListener('click', () => {
        $('#wiki-search').value = '';
        $('#wiki-results').innerHTML = '<div class="empty">Type to search the vault.</div>';
        wikiResults = [];
        wikiSelected = -1;
        $('#wiki-dlg').showModal();
        $('#wiki-search').focus();
      });
      $('#wiki-cancel').addEventListener('click', () => $('#wiki-dlg').close());
      $('#wiki-search').addEventListener('input', () => {
        const q = $('#wiki-search').value.trim();
        clearTimeout(wikiTimer);
        if (q.length < 2) {
          wikiResults = [];
          wikiSelected = -1;
          $('#wiki-results').innerHTML = '<div class="empty">Type to search the vault.</div>';
          return;
        }
        wikiTimer = setTimeout(() => wikiSearch(q), 150);
      });
      $('#wiki-search').addEventListener('keydown', e => {
        const n = wikiResults.length;
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (!n) return;
          wikiSelected = (wikiSelected + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
          renderWikiResults();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (n) insertWikilink(wikiResults[Math.max(wikiSelected, 0)].filename);
        }
      });
      $('#wiki-results').addEventListener('click', e => {
        const item = e.target.closest('a[data-idx]');
        if (!item) return;
        e.preventDefault();
        const r = wikiResults[Number(item.dataset.idx)];
        if (r) insertWikilink(r.filename);
      });

      // recent (a new note only) ----------------------------------------
      async function openRecent() {
        const list = $('#recent-list');
        list.innerHTML = '<div class="empty"><span class="spinner"></span> loading…</div>';
        $('#recent-dlg').showModal();
        try {
          const data = await apiJson('/sections?file_prefix=raw&exclude=body&limit=50');
          const items = (data.items ?? [])
            .filter(r => !r.file_path.includes('/archive/'))
            .sort((a, b) => (b.updated ?? '').localeCompare(a.updated ?? ''))
            .slice(0, 10);
          list.innerHTML = items.length
            ? items
                .map(
                  r =>
                    `<a href="/ui/edit.html?path=${encodeURIComponent(r.file_path)}"><b>${esc(r.title || r.file_path.split('/').pop())}</b><small>${esc(r.file_path)} · ${esc(r.updated ?? '')}</small></a>`
                )
                .join('')
            : '<div class="empty">No recent notes in <code>raw/</code>.</div>';
        } catch (e) {
          list.innerHTML = `<div class="empty">Failed to load: ${esc(e.message)}</div>`;
        }
      }

      // wiring ----------------------------------------------------------
      $('#save').addEventListener('click', () => save());
      $('#discard').addEventListener('click', () => $('#discard-dlg').showModal());
      $('#discard-cancel').addEventListener('click', () => $('#discard-dlg').close());
      $('#discard-confirm').addEventListener('click', () => {
        $('#discard-dlg').close();
        discard();
      });
      $('#view').addEventListener('click', () => {
        location.href = `/ui/note.html?path=${encodeURIComponent(state.path)}`;
      });
      $('#del').addEventListener('click', () => $('#del-dlg').showModal());
      $('#del-cancel').addEventListener('click', () => $('#del-dlg').close());
      $('#del-confirm').addEventListener('click', () => {
        $('#del-dlg').close();
        del();
      });
      $('#recent').addEventListener('click', openRecent);
      $('#recent-close').addEventListener('click', () => $('#recent-dlg').close());
      $('#outline').addEventListener('click', openOutline);
      $('#outline-close').addEventListener('click', () => $('#outline-dlg').close());
      $('#find-btn').addEventListener('click', openFind);

      // Tapping a shortcut must not take focus from the editor.
      $('#insert-row').addEventListener('mousedown', e => {
        if (e.target.closest('button')) e.preventDefault();
      });
      $('#insert-row').addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        e.preventDefault();
        if (btn.dataset.insertWrap !== undefined)
          insertWrap(btn.dataset.insertWrap, btn.dataset.insertEnd);
        else if (btn.dataset.insertPrefix !== undefined) insertPrefix(btn.dataset.insertPrefix);
      });

      // Keep the insert row above the on-screen keyboard.
      if (window.visualViewport) {
        const adjust = () => {
          const vv = window.visualViewport;
          const offset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
          document.documentElement.style.setProperty('--kb-offset', `${offset}px`);
        };
        window.visualViewport.addEventListener('resize', adjust);
        window.visualViewport.addEventListener('scroll', adjust);
        adjust();
      }

      document.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key === 's') {
          e.preventDefault();
          save();
        } else if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === 'f' || e.key === 'F')) {
          // Ours, not the browser's: GNOME Web reserves its own find at the chrome level.
          e.preventDefault();
          openFind();
        } else if (e.key === 'Escape') {
          closeFind();
        }
      });

      // A draft already on the server makes leaving safe; one still pending does not.
      window.addEventListener('beforeunload', e => {
        if (state.dirty && editor.value !== state.draftText) {
          keepDraft();
          e.preventDefault();
          e.returnValue = '';
        }
      });
      document.addEventListener('token-change', load);

      load();
    </script>
    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/theme.js"></script>
  </body>
</html>

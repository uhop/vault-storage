<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
    </script>
    <script>
      // api() adopts these by exact URL: keep them in step with the page's own first requests.
      (() => {
        const token = localStorage.getItem('vault.token');
        if (!token) return;
        const urls = ['/system/lint'];
        const early = (window.__early ??= new Map());
        for (const url of urls) {
          const res = fetch(url, {headers: {Authorization: `Bearer ${token}`}});
          res.catch(() => {});
          early.set(url, res);
        }
      })();
    </script>
    <title>vault-storage — lint review</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      main {
        max-width: 60rem;
      }
      h2 {
        font-size: 1rem;
        margin: 1.4rem 0 0.6rem;
      }
      h2:first-child {
        margin-top: 0;
      }
      section.fmw-card {
        margin-bottom: 1rem;
      }
      .fmw-card .why {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 0.8rem;
      }
      .fmw-card .why code {
        font-family: var(--mono);
        font-size: 0.85em;
      }
      td.id,
      td.path {
        font-family: var(--mono);
        font-size: 0.82rem;
        word-break: break-all;
      }
      td.path a {
        color: var(--accent);
        text-decoration: none;
      }
      td.path a:hover {
        text-decoration: underline;
      }
      td.stamp {
        font-family: var(--mono);
        font-size: 0.82rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .actions {
        margin-top: 0.8rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .actions .selected-count {
        color: var(--muted);
        font-size: 0.85rem;
        margin-right: auto;
      }
      .empty {
        padding: 2rem 1rem;
        font-size: 0.95rem;
      }
      .err {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body class="fmw">
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <main>
      <div id="status"></div>
      <div id="content">
        <div class="empty"><span class="spinner"></span> loading lint…</div>
      </div>
    </main>
    <div class="footer" id="footer"></div>

    <script type="module">
      import {api, apiJson, esc, getToken, showAuthDialog} from '/ui/api.js';
      import {sortable} from '/ui/fmw-sortable.js';
      const $ = sel => document.querySelector(sel);
      const $$ = sel => document.querySelectorAll(sel);

      const showStatus = (kind, msg) => {
        const el = $('#status');
        if (!kind) {
          el.innerHTML = '';
          return;
        }
        el.innerHTML = `<div class="${kind === 'ok' ? 'fmw-notice ok' : kind}">${msg}</div>`;
      };

      const renderEmpty = () => {
        $('#content').innerHTML = `<div class="empty">Lint is clean. Nothing to review.</div>`;
      };

      const renderDangling = (samples, total) => {
        if (samples.length === 0) return '';
        const moreNote =
          total > samples.length
            ? `<div class="why">Showing ${samples.length} of ${total}; refresh after deleting to see the next batch.</div>`
            : '';
        const rows = samples
          .map(
            (s, i) => `
    <tr>
      <td><input type="checkbox" data-alias="${esc(s.id)}" id="alias-${i}"></td>
      <td class="id"><label for="alias-${i}">${esc(s.id)}</label></td>
      <td class="id">${esc(s.canonical)}</td>
    </tr>
  `
          )
          .join('');
        return `
    <section class="fmw-card" data-section="aliases">
      <h2>Dangling tag aliases <span class="fmw-count">${samples.length}</span></h2>
      <div class="why">
        Aliases pointing to a canonical tag that's missing from the taxonomy. The alias was authored
        manually — pick which to drop. Server check: each selected alias is verified as still dangling
        before <code>DELETE</code>; live aliases are skipped.
      </div>
      <div class="fmw-scroll"><table class="fmw-table wide small wrap">
        <thead><tr><th style="width:2rem"></th><th>alias</th><th>canonical (missing)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${moreNote}
      <div class="actions">
        <span class="selected-count" id="aliases-selected">0 selected</span>
        <button id="aliases-toggle">Select all</button>
        <button id="aliases-delete" class="danger" disabled>Delete selected</button>
      </div>
    </section>
  `;
      };

      const TABLES = {
        temporal: {
          columns: [
            {key: 'id', label: 'record_id', value: s => s.id, text: true},
            {key: 'path', label: 'file_path', value: s => s.file_path, text: true},
            {key: 'created', label: 'created', value: s => s.created ?? '', text: true},
            {key: 'updated', label: 'updated', value: s => s.updated ?? '', text: true}
          ],
          storage: 'vault.lint.temporal.sort',
          fallback: {key: 'updated', dir: 'desc'},
          tie: s => s.id
        }
      };
      const {rows: sortRows, head: headRow, bind: bindSorting} = sortable(TABLES);
      const last = {temporal: [], total: 0};

      const renderTemporal = (samples, total) => {
        // Filter to the updated<created subset; future-stamp samples are auto-
        // fixed by the dashboard's "Clean now" button (cleanup-lint endpoint).
        const nowIso = new Date().toISOString();
        const reviewable = samples.filter(
          s =>
            !((s.created && s.created > nowIso) || (s.updated && s.updated > nowIso)) &&
            s.updated &&
            s.created &&
            s.updated < s.created
        );
        if (reviewable.length === 0) return '';
        const moreNote =
          total > samples.length
            ? `<div class="why">Showing ${samples.length} of ${total} samples (capped server-side); future-stamp samples are not shown here — fix via dashboard "Clean now".</div>`
            : '';
        const sort = sortRows('temporal', reviewable);
        const rows = reviewable
          .map(
            s => `
    <tr>
      <td class="id">${esc(s.id)}</td>
      <td class="path"><a href="/ui/note.html?path=${encodeURIComponent(s.file_path)}">${esc(s.file_path)}</a></td>
      <td class="stamp">${esc(s.created ?? '—')}</td>
      <td class="stamp fmw-bad">${esc(s.updated ?? '—')}</td>
    </tr>
  `
          )
          .join('');
        return `
    <section class="fmw-card" data-section="temporal">
      <h2>Temporal anomalies — <code>updated &lt; created</code> <span class="fmw-count">${reviewable.length}</span></h2>
      <div class="why">
        Frontmatter has <code>updated</code> earlier than <code>created</code>. Often manual paste
        error; sometimes a write-bug worth investigating. Open each note and fix the FM directly —
        no auto-fix endpoint, since re-stamping could mask the underlying cause.
      </div>
      <div class="fmw-scroll"><table class="fmw-table wide small wrap">
        <thead><tr>${headRow('temporal', sort)}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${moreNote}
    </section>
  `;
      };

      const updateAliasSelectionState = () => {
        const checks = $$('[data-alias]');
        const selected = [...checks].filter(c => c.checked).length;
        $('#aliases-selected').textContent = `${selected} selected`;
        $('#aliases-delete').disabled = selected === 0;
        const allSelected = selected === checks.length && checks.length > 0;
        $('#aliases-toggle').textContent = allSelected ? 'Select none' : 'Select all';
      };

      const wireAliasSection = () => {
        if (!$('[data-section="aliases"]')) return;
        $('#aliases-toggle').addEventListener('click', () => {
          const checks = [...$$('[data-alias]')];
          const allSelected = checks.every(c => c.checked);
          checks.forEach(c => {
            c.checked = !allSelected;
          });
          updateAliasSelectionState();
        });
        $('#aliases-delete').addEventListener('click', deleteSelectedAliases);
        updateAliasSelectionState();
      };

      const deleteSelectedAliases = async () => {
        const aliases = [...$$('[data-alias]:checked')].map(c => c.dataset.alias);
        if (aliases.length === 0) return;
        const btn = $('#aliases-delete');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'deleting…';
        try {
          const result = await apiJson('/maintenance/cleanup-tag-aliases', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({aliases})
          });
          const parts = [`deleted ${result.deleted.length}`];
          if (result.notDangling.length) parts.push(`skipped ${result.notDangling.length} live`);
          if (result.missing.length) parts.push(`${result.missing.length} not found`);
          showStatus('ok', `Tag aliases: ${parts.join(', ')}.`);
          await refresh();
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') {
            showAuthDialog();
            return;
          }
          showStatus('err', `Failed to delete aliases: ${esc(e.message)}`);
          btn.disabled = false;
          btn.textContent = original;
        }
      };

      const refresh = async () => {
        if (!getToken()) {
          showAuthDialog();
          return;
        }
        $('#content').innerHTML =
          `<div class="empty"><span class="spinner"></span> loading lint…</div>`;
        let lint;
        try {
          lint = await apiJson('/system/lint');
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') {
            showAuthDialog();
            return;
          }
          $('#content').innerHTML =
            `<div class="err">Failed to read /system/lint: ${esc(e.message)}</div>`;
          return;
        }

        const dangling = lint.checks?.dangling_tag_aliases?.samples ?? [];
        const danglingTotal = lint.checks?.dangling_tag_aliases?.count ?? 0;
        const temporal = lint.checks?.temporal_anomalies?.samples ?? [];
        const temporalTotal = lint.checks?.temporal_anomalies?.count ?? 0;
        Object.assign(last, {temporal, total: temporalTotal});
        const html =
          renderDangling(dangling, danglingTotal) + renderTemporal(temporal, temporalTotal);

        if (!html) {
          renderEmpty();
          $('#footer').textContent =
            `lint clean${lint.total_issues ? ' for these categories (other categories auto-fixable via dashboard)' : ''}`;
          return;
        }
        $('#content').innerHTML = html;
        wireAliasSection();
        $('#footer').textContent =
          `${lint.total_issues} total lint issues; ${danglingTotal} dangling aliases, ${temporalTotal} temporal anomalies`;
      };

      // Delegated: #content re-renders per refresh, one listener covers every checkbox.
      $('#content').addEventListener('change', e => {
        if (e.target.closest('[data-alias]')) updateAliasSelectionState();
      });

      document.addEventListener('token-change', refresh);

      // A sort redraws the temporal section alone, so the alias selections survive it.
      bindSorting($('#content'), () => {
        const section = $('[data-section="temporal"]');
        if (section) section.outerHTML = renderTemporal(last.temporal, last.total);
      });
      refresh();
    </script>
    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/theme.js"></script>
  </body>
</html>

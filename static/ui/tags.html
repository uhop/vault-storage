<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
    </script>
    <script>
      // api() adopts these by exact URL: keep them in step with the page's own first requests.
      (() => {
        performance.mark('head script');
        const token = localStorage.getItem('vault.token');
        if (!token) return;
        const sorts = ['count', 'count_asc', 'tag', 'tag_asc'];
        let sort = 'count';
        try {
          const s = localStorage.getItem('vault.tags.sort');
          if (sorts.includes(s)) sort = s;
        } catch {}
        const urls = [`/tags?limit=100&sort=${sort}`];
        const early = (window.__early ??= new Map());
        for (const url of urls) {
          const res = fetch(url, {headers: {Authorization: `Bearer ${token}`}});
          res.catch(() => {});
          early.set(url, res);
        }
      })();
    </script>
    <title>vault-storage — tags</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      main {
        max-width: 64rem;
      }
      .layout {
        display: grid;
        gap: 1rem;
        grid-template-columns: 18rem 1fr;
      }
      @media (max-width: 768px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      .tag-pane,
      .records-pane {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.8rem;
        min-height: 0;
      }
      .tag-pane h2,
      .records-pane h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted);
        margin: 0 0 0.5rem;
        font-weight: 600;
      }
      .tag-filter {
        width: 100%;
        padding: 0.5rem 0.6rem;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
        margin-bottom: 0.6rem;
      }
      .tag-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .tag-list li {
        padding: 0;
        margin: 0.15rem 0;
      }
      .tag-list button {
        width: 100%;
        text-align: left;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        column-gap: 0.5rem;
        padding: 0.35rem 0.55rem;
        border: 0;
        background: transparent;
        color: var(--fg);
        border-radius: 4px;
      }
      .tag-list button:hover {
        background: rgba(127, 127, 127, 0.12);
      }
      .tag-list button[aria-current='true'] {
        background: var(--accent);
        color: #fff;
      }
      .tag-list .name {
        font-family: var(--mono);
        font-size: 0.85rem;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tag-list .count {
        font-size: 0.75rem;
        color: inherit;
        opacity: 0.7;
        flex-shrink: 0;
      }
      .records-pane {
        min-height: 12rem;
      }
      .tag-sort {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.6rem;
      }
      .tag-sort select {
        flex: 1;
        padding: 0.35rem 0.5rem;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
      }
      .tag-sort button {
        min-width: 2.4rem;
      }
      .tag-list .desc {
        flex-basis: 100%;
        font-size: 0.75rem;
        opacity: 0.75;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pager {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.6rem 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .pager span {
        flex: 1;
        text-align: center;
      }
      .tag-info {
        margin: 0 0 0.8rem;
        font-size: 0.9rem;
      }
      .tag-info p {
        margin: 0 0 0.3rem;
      }
      .tag-info small {
        color: var(--muted);
      }
      .tag-info .row {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
      }
      .tag-info .row small {
        flex: 1;
      }
      .new-tag {
        margin-bottom: 0.6rem;
        font-size: 0.85rem;
      }
      .new-tag summary {
        cursor: pointer;
        color: var(--muted);
      }
      .new-tag form {
        display: grid;
        gap: 0.4rem;
        margin-top: 0.5rem;
      }
      .new-tag input,
      .new-tag textarea {
        width: 100%;
        padding: 0.4rem 0.5rem;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
      }
      .new-tag input {
        font-family: var(--mono);
      }
    </style>
  </head>
  <body class="fmw">
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <main>
      <div class="layout">
        <section class="tag-pane">
          <h2>
            Tags
            <span
              id="tag-total"
              style="color: var(--muted); font-weight: 400; font-size: 0.75rem"
            ></span>
          </h2>
          <input
            type="search"
            id="tag-filter"
            class="tag-filter"
            placeholder="Filter tags…"
            autocomplete="off"
            spellcheck="false"
          />
          <details class="new-tag">
            <summary>New tag</summary>
            <form id="new-tag-form">
              <input
                id="new-tag-name"
                placeholder="tag-name"
                pattern="[a-z0-9][a-z0-9\-]*"
                title="Lowercase letters, digits, and hyphens; starts with a letter or digit"
                required
                autocomplete="off"
                spellcheck="false"
              />
              <textarea
                id="new-tag-desc"
                rows="2"
                placeholder="What a note carrying this tag is about"
                required
              ></textarea>
              <button type="submit">Create</button>
              <div id="new-tag-msg"></div>
            </form>
          </details>
          <div class="tag-sort">
            <select id="tag-sort-field" aria-label="Sort tags by">
              <option value="count">By popularity</option>
              <option value="tag">By name</option>
            </select>
            <button type="button" id="tag-sort-order"></button>
          </div>
          <div class="pager" data-list="tags" hidden></div>
          <ul id="tag-list" class="tag-list"></ul>
          <div class="pager" data-list="tags" hidden></div>
        </section>
        <section class="records-pane">
          <h2 id="records-heading">Pick a tag</h2>
          <div id="tag-info" class="tag-info" hidden></div>
          <div class="pager" data-list="records" hidden></div>
          <div id="records"></div>
          <div class="pager" data-list="records" hidden></div>
        </section>
      </div>
    </main>

    <dialog id="del-tag-dlg">
      <h2>Delete tag <code id="del-tag-name"></code>?</h2>
      <p id="del-tag-body"></p>
      <div class="row">
        <button id="del-tag-cancel">Cancel</button>
        <button id="del-tag-confirm" class="danger primary">Delete</button>
      </div>
    </dialog>

    <script type="module">
      import {api, apiJson, esc, getToken, showAuthDialog} from '/ui/api.js';
      const $ = sel => document.querySelector(sel);
      const $$ = sel => document.querySelectorAll(sel);

      const PAGE = 100;
      const SORTS = ['count', 'count_asc', 'tag', 'tag_asc'];

      let sort = 'count';
      try {
        const s = localStorage.getItem('vault.tags.sort');
        if (SORTS.includes(s)) sort = s;
      } catch {}

      const lists = {
        tags: {items: [], offset: 0, total: 0, seq: 0},
        records: {items: [], offset: 0, total: 0, seq: 0}
      };
      let activeTag = null;
      let activeInfo = null;

      const isAuthError = e => e.message === 'unauthorized' || e.message === 'no-token';
      const fmtNum = n => n.toLocaleString('en-US');

      const renderPager = (name, noun) => {
        const l = lists[name];
        const pagers = $$(`.pager[data-list="${name}"]`);
        const paged = l.total > PAGE;
        const range =
          l.total === 0
            ? 'None'
            : `${fmtNum(l.offset + 1)}–${fmtNum(l.offset + l.items.length)} of ${fmtNum(l.total)}${noun ? ` ${noun}` : ''}`;
        pagers.forEach(p => {
          p.hidden = l.total === 0;
          p.innerHTML =
            `<button type="button" data-step="-1" ${l.offset === 0 ? 'disabled' : ''}>‹ Prev</button>` +
            `<span>${range}</span>` +
            `<button type="button" data-step="1" ${l.offset + l.items.length >= l.total ? 'disabled' : ''}>Next ›</button>`;
          p.querySelectorAll('button').forEach(b => (b.hidden = !paged));
        });
      };

      // Must match the head script's early request for the first page.
      const tagsUrl = offset => {
        const filter = $('#tag-filter').value.trim().toLowerCase();
        return (
          `/tags?limit=${PAGE}&sort=${sort}` +
          (filter ? `&contains=${encodeURIComponent(filter)}` : '') +
          (offset ? `&offset=${offset}` : '')
        );
      };

      const renderSortControls = () => {
        const byName = sort.startsWith('tag');
        const asc = sort.endsWith('_asc');
        $('#tag-sort-field').value = byName ? 'tag' : 'count';
        const btn = $('#tag-sort-order');
        btn.textContent = asc ? '↑' : '↓';
        btn.title = byName
          ? asc
            ? 'A to Z'
            : 'Z to A'
          : asc
            ? 'Least used first'
            : 'Most used first';
        btn.setAttribute('aria-label', `Sort order: ${btn.title}`);
      };

      const setSort = next => {
        sort = next;
        try {
          localStorage.setItem('vault.tags.sort', sort);
        } catch {}
        renderSortControls();
        loadTags(0);
      };

      const renderTagList = () => {
        const l = lists.tags;
        const filtered = $('#tag-filter').value.trim() !== '';
        $('#tag-total').textContent = `· ${fmtNum(l.total)} ${filtered ? 'matching' : 'total'}`;
        renderPager('tags', '');
        if (l.items.length === 0) {
          $('#tag-list').innerHTML = '<li><div class="empty">No tags match.</div></li>';
          return;
        }
        $('#tag-list').innerHTML = l.items
          .map(
            t => `
      <li>
        <button data-tag="${esc(t.tag)}" aria-current="${t.tag === activeTag}">
          <span class="name">${esc(t.tag)}</span>
          <span class="count">${t.record_count}</span>
          ${t.description ? `<span class="desc" title="${esc(t.description)}">${esc(t.description)}</span>` : ''}
        </button>
      </li>
    `
          )
          .join('');
      };

      const loadTags = async offset => {
        const l = lists.tags;
        const seq = ++l.seq;
        $('#tag-list').innerHTML =
          '<li><div class="empty"><span class="spinner"></span> loading…</div></li>';
        try {
          const data = await apiJson(tagsUrl(offset));
          if (seq !== l.seq) return;
          l.items = data.items ?? [];
          l.offset = data.offset ?? offset;
          l.total = data.total ?? l.items.length;
          renderTagList();
        } catch (e) {
          if (seq !== l.seq) return;
          if (isAuthError(e)) {
            showAuthDialog();
            return;
          }
          $('#tag-list').innerHTML =
            `<li><div class="err">Failed to load: ${esc(e.message)}</div></li>`;
        }
      };

      const fmtDate = iso => (iso ? iso.slice(0, 10) : '');

      const renderRecords = () => {
        const l = lists.records;
        renderPager('records', 'records, most recently updated first');
        if (l.items.length === 0) {
          $('#records').innerHTML = '<div class="empty">No records.</div>';
          return;
        }
        $('#records').innerHTML = `<div class="fmw-records">${l.items
          .map(
            r => `
        <a href="/ui/note.html?path=${encodeURIComponent(r.file_path)}">
          <b>${esc(r.title || r.file_path.split('/').pop())}</b>
          <small>${esc(r.file_path)}</small>
          <small>${esc(r.type ?? '')} · updated ${esc(fmtDate(r.updated))}</small>
        </a>
      `
          )
          .join('')}</div>`;
      };

      const loadRecords = async offset => {
        const l = lists.records;
        const seq = ++l.seq;
        $('#records').innerHTML = '<div class="empty"><span class="spinner"></span> loading…</div>';
        try {
          const data = await apiJson(
            `/tags/${encodeURIComponent(activeTag)}/records?limit=${PAGE}` +
              (offset ? `&offset=${offset}` : '')
          );
          if (seq !== l.seq) return;
          l.items = data.items ?? [];
          l.offset = data.offset ?? offset;
          l.total = data.total ?? l.items.length;
          renderRecords();
        } catch (e) {
          if (seq !== l.seq) return;
          if (isAuthError(e)) {
            showAuthDialog();
            return;
          }
          $('#records').innerHTML = `<div class="err">Failed to load: ${esc(e.message)}</div>`;
        }
      };

      const loadTagInfo = async tag => {
        const box = $('#tag-info');
        box.hidden = true;
        activeInfo = null;
        try {
          const info = await apiJson(`/tags/${encodeURIComponent(tag)}`);
          if (tag !== activeTag) return;
          activeInfo = info;
          const aliases = info.aliases?.length
            ? ` · aliases: ${info.aliases.map(esc).join(', ')}`
            : '';
          box.innerHTML =
            (info.description ? `<p>${esc(info.description)}</p>` : '') +
            `<div class="row"><small>${esc(info.origin ?? '')} · added ${esc(fmtDate(info.added))}${aliases}</small>` +
            `<button type="button" id="del-tag" class="danger">Delete tag</button></div>`;
          box.hidden = false;
        } catch {
          // The info line is an extra; the records list stands without it.
        }
      };

      const fetchRecordsForTag = tag => {
        activeTag = tag;
        $$('#tag-list button').forEach(b =>
          b.setAttribute('aria-current', b.dataset.tag === tag ? 'true' : 'false')
        );
        $('#records-heading').textContent = `Records tagged ${tag}`;
        loadTagInfo(tag);
        loadRecords(0);
      };

      const init = async () => {
        if (!getToken()) {
          showAuthDialog();
          return;
        }
        renderSortControls();
        await loadTags(0);
        const hashTag = decodeURIComponent(location.hash.replace(/^#/, ''));
        if (hashTag) fetchRecordsForTag(hashTag);
      };

      document.addEventListener('token-change', init);

      let filterTimer;
      $('#tag-filter').addEventListener('input', () => {
        clearTimeout(filterTimer);
        filterTimer = setTimeout(() => loadTags(0), 200);
      });

      $('#tag-sort-field').addEventListener('change', e =>
        setSort(e.target.value === 'tag' ? 'tag_asc' : 'count')
      );

      $('#tag-sort-order').addEventListener('click', () =>
        setSort(sort.endsWith('_asc') ? sort.slice(0, -'_asc'.length) : `${sort}_asc`)
      );

      document.addEventListener('click', e => {
        const btn = e.target.closest('.pager button[data-step]');
        if (!btn) return;
        const pager = btn.closest('.pager');
        const name = pager.dataset.list;
        const all = $$(`.pager[data-list="${name}"]`);
        if (pager === all[all.length - 1])
          pager.closest('section').scrollIntoView({block: 'start'});
        const offset = Math.max(0, lists[name].offset + Number(btn.dataset.step) * PAGE);
        if (name === 'tags') loadTags(offset);
        else loadRecords(offset);
      });

      $('#tag-list').addEventListener('click', e => {
        const btn = e.target.closest('button[data-tag]');
        if (!btn) return;
        const tag = btn.dataset.tag;
        history.replaceState(null, '', `#${encodeURIComponent(tag)}`);
        fetchRecordsForTag(tag);
      });

      const plural = (n, word) => `${fmtNum(n)} ${word}${n === 1 ? '' : 's'}`;

      $('#tag-info').addEventListener('click', e => {
        if (!e.target.closest('#del-tag') || !activeInfo) return;
        const {tag, record_count: count, aliases} = activeInfo;
        $('#del-tag-name').textContent = tag;
        $('#del-tag-body').textContent =
          (count
            ? `It is removed from the frontmatter of ${plural(count, 'note')}, then from the taxonomy`
            : 'No note carries it; it is removed from the taxonomy') +
          (aliases?.length ? ` with ${plural(aliases.length, 'alias')}` : '') +
          '. The UI cannot undo this.';
        $('#del-tag-dlg').showModal();
      });
      $('#del-tag-cancel').addEventListener('click', () => $('#del-tag-dlg').close());
      $('#del-tag-confirm').addEventListener('click', async () => {
        $('#del-tag-dlg').close();
        const tag = activeInfo?.tag;
        if (!tag) return;
        try {
          await api(`/tags/taxonomy/${encodeURIComponent(tag)}`, {method: 'DELETE'});
        } catch (e) {
          if (isAuthError(e)) showAuthDialog();
          else
            $('#tag-info').insertAdjacentHTML(
              'beforeend',
              `<div class="err">${esc(e.message)}</div>`
            );
          return;
        }
        activeTag = null;
        activeInfo = null;
        history.replaceState(null, '', location.pathname);
        $('#records-heading').textContent = `Deleted ${tag}`;
        $('#tag-info').hidden = true;
        $('#records').innerHTML = '';
        renderPager('records', '');
        loadTags(lists.tags.offset);
      });

      $('#new-tag-form').addEventListener('submit', async e => {
        e.preventDefault();
        const tag = $('#new-tag-name').value.trim();
        const description = $('#new-tag-desc').value.trim();
        const msg = $('#new-tag-msg');
        msg.textContent = '';
        try {
          await api('/tags/taxonomy', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({tag, description, origin: 'manual'})
          });
        } catch (err) {
          if (isAuthError(err)) showAuthDialog();
          else msg.innerHTML = `<div class="err">${esc(err.message)}</div>`;
          return;
        }
        e.target.reset();
        $('#tag-filter').value = tag;
        history.replaceState(null, '', `#${encodeURIComponent(tag)}`);
        await loadTags(0);
        fetchRecordsForTag(tag);
      });

      window.addEventListener('hashchange', () => {
        const hashTag = decodeURIComponent(location.hash.replace(/^#/, ''));
        if (hashTag && hashTag !== activeTag) fetchRecordsForTag(hashTag);
      });

      init();
    </script>
    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/theme.js"></script>
  </body>
</html>

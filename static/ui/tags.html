<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
    </script>
    <script>
      // api() adopts these by exact URL: keep them in step with the page's own first requests.
      (() => {
        performance.mark('head script');
        const token = localStorage.getItem('vault.token');
        if (!token) return;
        const sorts = ['count', 'count_asc', 'tag', 'tag_asc'];
        let sort = 'count';
        try {
          const s = localStorage.getItem('vault.tags.sort');
          if (sorts.includes(s)) sort = s;
        } catch {}
        const urls = [`/tags?limit=100&sort=${sort}`];
        const early = (window.__early ??= new Map());
        for (const url of urls) {
          const res = fetch(url, {headers: {Authorization: `Bearer ${token}`}});
          res.catch(() => {});
          early.set(url, res);
        }
      })();
    </script>
    <title>vault-storage — tags</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      main {
        max-width: 64rem;
      }
      .layout {
        display: grid;
        gap: 1rem;
        grid-template-columns: 18rem 1fr;
      }
      @media (max-width: 768px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      .tag-pane,
      .records-pane {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.8rem;
        min-height: 0;
      }
      .tag-pane h2,
      .records-pane h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted);
        margin: 0 0 0.5rem;
        font-weight: 600;
      }
      .tag-filter {
        width: 100%;
        padding: 0.5rem 0.6rem;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
        margin-bottom: 0.6rem;
      }
      .tag-list {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 60vh;
        overflow-y: auto;
      }
      .tag-list li {
        padding: 0;
        margin: 0.15rem 0;
      }
      .tag-list button {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        padding: 0.35rem 0.55rem;
        border: 0;
        background: transparent;
        color: var(--fg);
        border-radius: 4px;
      }
      .tag-list button:hover {
        background: rgba(127, 127, 127, 0.12);
      }
      .tag-list button[aria-current='true'] {
        background: var(--accent);
        color: #fff;
      }
      .tag-list .name {
        font-family: var(--mono);
        font-size: 0.85rem;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tag-list .count {
        font-size: 0.75rem;
        color: inherit;
        opacity: 0.7;
        flex-shrink: 0;
      }
      .records-pane {
        min-height: 12rem;
      }
      .tag-sort {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.6rem;
      }
      .tag-sort select {
        flex: 1;
        padding: 0.35rem 0.5rem;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
      }
      .tag-sort button {
        min-width: 2.4rem;
      }
      .more {
        margin-top: 0.6rem;
        width: 100%;
      }
    </style>
  </head>
  <body class="fmw">
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <main>
      <div class="layout">
        <section class="tag-pane">
          <h2>
            Tags
            <span
              id="tag-total"
              style="color: var(--muted); font-weight: 400; font-size: 0.75rem"
            ></span>
          </h2>
          <input
            type="search"
            id="tag-filter"
            class="tag-filter"
            placeholder="Filter tags…"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="tag-sort">
            <select id="tag-sort-field" aria-label="Sort tags by">
              <option value="count">By popularity</option>
              <option value="tag">By name</option>
            </select>
            <button type="button" id="tag-sort-order"></button>
          </div>
          <ul id="tag-list" class="tag-list"></ul>
          <button type="button" id="tag-more" class="more" hidden>Load more</button>
        </section>
        <section class="records-pane">
          <h2 id="records-heading">Pick a tag</h2>
          <div id="records"></div>
          <button type="button" id="records-more" class="more" hidden>Load more</button>
        </section>
      </div>
    </main>

    <script type="module">
      import {apiJson, esc, getToken, showAuthDialog} from '/ui/api.js';
      const $ = sel => document.querySelector(sel);
      const $$ = sel => document.querySelectorAll(sel);

      const PAGE = 100;
      const SORTS = ['count', 'count_asc', 'tag', 'tag_asc'];

      let sort = 'count';
      try {
        const s = localStorage.getItem('vault.tags.sort');
        if (SORTS.includes(s)) sort = s;
      } catch {}

      let tags = [];
      let tagsTotal = 0;
      let tagsSeq = 0;
      let activeTag = null;
      let records = [];
      let recordsTotal = 0;
      let recordsSeq = 0;

      const isAuthError = e => e.message === 'unauthorized' || e.message === 'no-token';

      // Must match the head script's early request for the first page.
      const tagsUrl = offset => {
        const filter = $('#tag-filter').value.trim().toLowerCase();
        return (
          `/tags?limit=${PAGE}&sort=${sort}` +
          (filter ? `&contains=${encodeURIComponent(filter)}` : '') +
          (offset ? `&offset=${offset}` : '')
        );
      };

      const renderSortControls = () => {
        const byName = sort.startsWith('tag');
        const asc = sort.endsWith('_asc');
        $('#tag-sort-field').value = byName ? 'tag' : 'count';
        const btn = $('#tag-sort-order');
        btn.textContent = asc ? '↑' : '↓';
        btn.title = byName
          ? asc
            ? 'A to Z'
            : 'Z to A'
          : asc
            ? 'Least used first'
            : 'Most used first';
        btn.setAttribute('aria-label', `Sort order: ${btn.title}`);
      };

      const setSort = next => {
        sort = next;
        try {
          localStorage.setItem('vault.tags.sort', sort);
        } catch {}
        renderSortControls();
        loadTags();
      };

      const renderTagList = () => {
        const filtered = $('#tag-filter').value.trim() !== '';
        $('#tag-total').textContent = `· ${tagsTotal} ${filtered ? 'matching' : 'total'}`;
        $('#tag-more').hidden = tags.length >= tagsTotal;
        if (tags.length === 0) {
          $('#tag-list').innerHTML = '<li><div class="empty">No tags match.</div></li>';
          return;
        }
        $('#tag-list').innerHTML = tags
          .map(
            t => `
      <li>
        <button data-tag="${esc(t.tag)}" aria-current="${t.tag === activeTag}">
          <span class="name">${esc(t.tag)}</span>
          <span class="count">${t.record_count}</span>
        </button>
      </li>
    `
          )
          .join('');
      };

      const loadTags = async (append = false) => {
        const seq = ++tagsSeq;
        if (!append) {
          $('#tag-list').innerHTML =
            '<li><div class="empty"><span class="spinner"></span> loading…</div></li>';
          $('#tag-more').hidden = true;
        }
        try {
          const data = await apiJson(tagsUrl(append ? tags.length : 0));
          if (seq !== tagsSeq) return;
          const items = data.items ?? [];
          tags = append ? tags.concat(items) : items;
          tagsTotal = data.total ?? tags.length;
          renderTagList();
        } catch (e) {
          if (seq !== tagsSeq) return;
          if (isAuthError(e)) {
            showAuthDialog();
            return;
          }
          $('#tag-list').innerHTML =
            `<li><div class="err">Failed to load: ${esc(e.message)}</div></li>`;
        }
      };

      const fmtDate = iso => (iso ? iso.slice(0, 10) : '');

      const renderRecords = () => {
        $('#records-more').hidden = records.length >= recordsTotal;
        if (records.length === 0) {
          $('#records').innerHTML = '<div class="empty">No records.</div>';
          return;
        }
        const shown =
          records.length < recordsTotal
            ? `<div class="empty">Showing ${records.length} of ${recordsTotal}, most recently updated first.</div>`
            : '';
        $('#records').innerHTML = `${shown}<div class="fmw-records">${records
          .map(
            r => `
        <a href="/ui/note.html?path=${encodeURIComponent(r.file_path)}">
          <b>${esc(r.title || r.file_path.split('/').pop())}</b>
          <small>${esc(r.file_path)}</small>
          <small>${esc(r.type ?? '')} · updated ${esc(fmtDate(r.updated))}</small>
        </a>
      `
          )
          .join('')}</div>`;
      };

      const loadRecords = async (append = false) => {
        const seq = ++recordsSeq;
        const tag = activeTag;
        if (!append) {
          $('#records').innerHTML =
            '<div class="empty"><span class="spinner"></span> loading…</div>';
          $('#records-more').hidden = true;
        }
        try {
          const offset = append ? records.length : 0;
          const data = await apiJson(
            `/tags/${encodeURIComponent(tag)}/records?limit=${PAGE}` +
              (offset ? `&offset=${offset}` : '')
          );
          if (seq !== recordsSeq) return;
          const items = data.items ?? [];
          records = append ? records.concat(items) : items;
          recordsTotal = data.total ?? records.length;
          renderRecords();
        } catch (e) {
          if (seq !== recordsSeq) return;
          if (isAuthError(e)) {
            showAuthDialog();
            return;
          }
          $('#records').innerHTML = `<div class="err">Failed to load: ${esc(e.message)}</div>`;
        }
      };

      const fetchRecordsForTag = tag => {
        activeTag = tag;
        $$('#tag-list button').forEach(b =>
          b.setAttribute('aria-current', b.dataset.tag === tag ? 'true' : 'false')
        );
        $('#records-heading').textContent = `Records tagged ${tag}`;
        loadRecords();
      };

      const init = async () => {
        if (!getToken()) {
          showAuthDialog();
          return;
        }
        renderSortControls();
        await loadTags();
        const hashTag = decodeURIComponent(location.hash.replace(/^#/, ''));
        if (hashTag) fetchRecordsForTag(hashTag);
      };

      document.addEventListener('token-change', init);

      let filterTimer;
      $('#tag-filter').addEventListener('input', () => {
        clearTimeout(filterTimer);
        filterTimer = setTimeout(() => loadTags(), 200);
      });

      $('#tag-sort-field').addEventListener('change', e =>
        setSort(e.target.value === 'tag' ? 'tag_asc' : 'count')
      );

      $('#tag-sort-order').addEventListener('click', () =>
        setSort(sort.endsWith('_asc') ? sort.slice(0, -'_asc'.length) : `${sort}_asc`)
      );

      $('#tag-more').addEventListener('click', () => loadTags(true));
      $('#records-more').addEventListener('click', () => loadRecords(true));

      $('#tag-list').addEventListener('click', e => {
        const btn = e.target.closest('button[data-tag]');
        if (!btn) return;
        const tag = btn.dataset.tag;
        history.replaceState(null, '', `#${encodeURIComponent(tag)}`);
        fetchRecordsForTag(tag);
      });

      window.addEventListener('hashchange', () => {
        const hashTag = decodeURIComponent(location.hash.replace(/^#/, ''));
        if (hashTag && hashTag !== activeTag) fetchRecordsForTag(hashTag);
      });

      init();
    </script>
    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/theme.js"></script>
  </body>
</html>

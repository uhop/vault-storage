<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>vault-storage — fleet</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      main {
        max-width: 80rem;
      }
      h2 {
        font-size: 1rem;
        margin: 0;
      }
      section + section {
        margin-top: 1.6rem;
      }
      .bar {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-bottom: 0.6rem;
      }
      .bar .meta {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .bar label {
        font-size: 0.85rem;
        color: var(--muted);
      }
      select,
      input[type='search'] {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.2rem 0.4rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--fg);
      }
      .switch {
        display: inline-flex;
        align-self: center;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .switch button {
        border: 0;
        border-radius: 0;
        padding: 0.25rem 0.75rem;
        font-size: 0.9rem;
        font-weight: 600;
        background: transparent;
        color: var(--muted);
      }
      .switch button + button {
        border-left: 1px solid var(--line);
      }
      .switch button:hover {
        color: var(--fg);
      }
      .switch button[aria-pressed='true'] {
        background: var(--card);
        color: var(--fg);
      }
      a {
        color: var(--accent);
      }
      code {
        font-family: var(--mono);
        font-size: 0.9em;
      }
      .brief .lead {
        margin: 0 0 0.5rem;
      }
      .brief ul {
        margin: 0;
        padding-left: 1.2rem;
      }
      .brief li {
        margin: 0.3rem 0;
      }
      .brief .repo {
        font-family: var(--mono);
      }
      a.x {
        font-size: 0.75rem;
        color: var(--muted);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 0.35em;
        margin-left: 0.3rem;
        vertical-align: 0.1em;
      }
      a.x:hover {
        color: var(--fg);
        border-color: var(--muted);
      }
      .scroll {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.35rem 0.6rem;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      th.sortable {
        cursor: pointer;
        user-select: none;
      }
      th.sortable:hover {
        color: var(--fg);
      }
      th[aria-sort='ascending']::after {
        content: ' ▲';
        font-size: 0.7em;
      }
      th[aria-sort='descending']::after {
        content: ' ▼';
        font-size: 0.7em;
      }
      th .sub {
        display: block;
        font-size: 0.75rem;
        font-weight: 400;
      }
      th.n,
      td.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      td.name {
        font-family: var(--mono);
      }
      tr.repo td.name {
        color: var(--accent);
        cursor: pointer;
      }
      tr.repo td.name:hover,
      tr.repo.open td.name {
        text-decoration: underline;
      }
      tr.total td {
        font-weight: 600;
        border-bottom: 0;
      }
      tr.detail td {
        white-space: normal;
        background: var(--card);
        padding: 0.6rem 0.9rem 0.7rem;
        font-size: 0.85rem;
      }
      tr.detail ul {
        margin: 0.15rem 0 0.4rem;
        padding-left: 1.2rem;
      }
      .links {
        margin-top: 0.4rem;
        color: var(--muted);
      }
      .zero,
      .quiet {
        color: var(--muted);
      }
      .warn {
        color: var(--warn);
      }
      .bad {
        color: var(--bad);
      }
      .ok {
        color: var(--ok);
      }
      .empty {
        padding: 0.8rem 0;
        text-align: start;
      }
      .err {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <main>
      <div id="status"></div>
      <section>
        <div class="bar">
          <h2>Movement</h2>
          <label
            >since
            <select id="window"></select
          ></label>
          <span class="meta" id="runs-meta"></span>
        </div>
        <div class="brief" id="brief"></div>
      </section>
      <section>
        <div class="bar">
          <div class="switch" role="group" aria-label="Table">
            <button type="button" data-view="repos">Repositories</button>
            <button type="button" data-view="packages">Packages</button>
          </div>
          <input type="search" id="filter" placeholder="filter packages" hidden />
          <span class="meta" id="table-meta"></span>
        </div>
        <div class="scroll" id="table"></div>
      </section>
    </main>
    <div class="footer" id="footer"></div>

    <script type="module">
      import {api, apiJson, esc, getToken, showAuthDialog} from '/ui/api.js';
      import {
        DIGEST_PATH,
        stateDocPath,
        parseRuns,
        parseBaseline,
        parsePackages,
        parseWhen,
        storedMovement,
        brief,
        baselineRow,
        alertText,
        plural,
        short,
        packageRows,
        dependentsChange,
        compact,
        percent
      } from '/ui/fleet-digest.js';
      import {
        WINDOWS,
        WINDOW_KEY,
        windowState,
        isStale,
        ext,
        renderParts,
        queueHref,
        projectHref,
        npmHref,
        githubDetail
      } from '/ui/fleet-view.js';
      import {sparkline, rangeLabel, dayLabel, monthDay} from '/ui/fleet-charts.js';

      const VIEW_PARAM = 'view';
      const SORT_KEY = 'vault.fleet.packages.sort';
      const LOADING = '<div class="empty"><span class="spinner"></span> loading…</div>';
      const DAY_MS = 864e5;
      const $ = sel => document.querySelector(sel);

      let runs = [],
        entries = [];

      const cutoffOf = w => (w === 'all' ? null : parseWhen(w));
      const viewState = () =>
        new URLSearchParams(location.search).get(VIEW_PARAM) === 'packages' ? 'packages' : 'repos';
      const rowId = repo => `repo-${repo.replace(/[^A-Za-z0-9]+/g, '-')}`;
      const nameOf = entry => entry.baseline.repo ?? entry.project;

      const renderBrief = () => {
        const {
          digest,
          runs: selected,
          cutoff
        } = storedMovement(runs, {
          cutoff: cutoffOf(windowState())
        });
        $('#runs-meta').textContent = runs.length
          ? `${plural(selected.length, 'run')} in the window · ${plural(runs.length, 'run')} stored, newest ${short(runs[0].collected_at)}`
          : '';
        if (!runs.length) {
          $('#brief').innerHTML =
            `<div class="empty">No stored runs in <code>${esc(DIGEST_PATH)}</code> — run <code>/fleet-status</code>, then commit.</div>`;
          return;
        }
        if (!selected.length) {
          $('#brief').innerHTML =
            `<div class="empty">No stored runs since ${esc(short(cutoff))}.</div>`;
          return;
        }
        const m = brief(digest);
        const stored = m.stored
          ? ` (${plural(m.stored.runs, 'stored run')}, newest ${short(m.stored.newest)})`
          : '';
        const lines = m.moved.map(
          x =>
            `<li><span class="repo">${ext(`https://github.com/${x.repo}`, x.name)}</span>${
              x.project
                ? `<a class="x" href="${queueHref(x.project)}" title="The project's queue">queue</a><a class="x" href="${projectHref(x.project)}" title="The project's GitHub and npm details">details</a>`
                : ''
            }: ${x.phrases.map(renderParts).join('; ')}</li>`
        );
        if (m.counters.length) lines.push(`<li>counters: ${esc(m.counters.join('; '))}</li>`);
        if (m.firstRuns.length)
          lines.push(
            `<li>first run: ${esc(plural(m.firstRuns.length, 'repository', 'repositories'))} (baseline recorded)</li>`
          );
        if (m.errors.length)
          lines.push(
            `<li>errors: ${esc(m.errors.map(e => `${e.name}: ${e.message}`).join('; '))}</li>`
          );
        if (m.partial)
          lines.push(`<li>partial errors: ${m.partial} (details in the stored run)</li>`);
        if (m.quiet > 0)
          lines.push(`<li>quiet: ${esc(plural(m.quiet, 'repository', 'repositories'))}</li>`);
        if (!lines.length) lines.push('<li>none</li>');
        $('#brief').innerHTML =
          `<p class="lead">Fleet movement since ${esc(m.stamp)} — ${esc(plural(m.repos, 'repository', 'repositories'))}, ${m.moved.length} with movement${esc(stored)}</p><ul>${lines.join('')}</ul>`;
      };

      // ─── Repositories ────────────────────────────────────────────────────────

      const numCell = (n, cls = '') => `<td class="n ${n === 0 ? 'zero' : cls}">${esc(n)}</td>`;
      const alertCell = a =>
        `<td class="n ${!a ? 'zero' : a.open > 0 ? 'warn' : ''}" title="${esc(
          a
            ? Object.entries(a.by_severity)
                .map(([k, n]) => `${n} ${k}`)
                .join(', ') || 'no open alerts'
            : 'not available'
        )}">${esc(alertText(a))}</td>`;
      const ciClass = ci =>
        !ci ? 'zero' : ci.state === 'success' ? 'ok' : ci.state === 'failure' ? 'bad' : 'warn';
      const ciCell = ci =>
        `<td class="${ciClass(ci)}" title="${esc(ci ? `${ci.name}, ${short(ci.updated_at)}` : 'no workflow run recorded')}">${
          ci ? (ci.html_url ? ext(ci.html_url, ci.state, ciClass(ci)) : esc(ci.state)) : 'none'
        }</td>`;

      const repoEntries = () => entries.filter(e => e.baseline);

      const renderRepos = () => {
        const list = repoEntries();
        $('#table-meta').textContent =
          `${plural(list.length, 'repository', 'repositories')} with a stored baseline · ${plural(entries.length, 'project')} with stored fleet data`;
        if (!list.length) {
          $('#table').innerHTML =
            '<div class="empty">No stored baselines — no <code>projects/*/state.md</code> carries a <code>## GitHub</code> block yet.</div>';
          return;
        }
        const sum = {issues: 0, prs: 0, stars: 0, forks: 0};
        const rows = list.map(entry => {
          const r = baselineRow(entry.baseline),
            name = nameOf(entry);
          sum.issues += r.issues;
          sum.prs += r.prs;
          sum.stars += r.stars ?? 0;
          sum.forks += r.forks ?? 0;
          return `<tr class="repo" id="${rowId(name)}" data-repo="${esc(name)}">
            <td class="name" title="Expand the stored baseline">${esc(name)}</td>
            ${numCell(r.issues)}${numCell(r.prs)}
            <td class="n ${r.discussions === 0 || !r.hasDiscussions ? 'zero' : ''}">${r.hasDiscussions ? r.discussions : '-'}</td>
            ${numCell(r.stars ?? '-')}${numCell(r.forks ?? '-')}
            <td class="n ${r.advisories === 0 ? 'zero' : r.noCve ? 'warn' : ''}">${r.advisories}${r.noCve ? ` (${r.noCve} no CVE)` : ''}</td>
            ${alertCell(r.dependabot)}${alertCell(r.codeScanning)}
            ${ciCell(r.ci)}
            <td class="${isStale(r.collected_at) ? 'warn' : ''}" title="${esc(r.collected_at ?? '')}">${esc(short(r.collected_at))}</td>
          </tr>`;
        });
        rows.push(
          `<tr class="total"><td>Total (${list.length})</td>${numCell(sum.issues)}${numCell(sum.prs)}<td></td>${numCell(sum.stars)}${numCell(sum.forks)}<td colspan="5"></td></tr>`
        );
        $('#table').innerHTML = `<table>
          <thead><tr>
            <th>Repository</th><th class="n">Issues</th><th class="n">PRs</th><th class="n">Discussions</th>
            <th class="n">Stars</th><th class="n">Forks</th><th class="n">Advisories</th>
            <th class="n">Dependabot</th><th class="n">Scanning</th><th>CI</th><th>Collected</th>
          </tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>`;
        expandFromHash();
      };

      const detailRow = entry => {
        const {html, links} = githubDetail(entry, runs, cutoffOf(windowState()));
        const tr = document.createElement('tr');
        tr.className = 'detail';
        tr.innerHTML = `<td colspan="11">${html}<div class="links"><a href="${projectHref(entry.project)}">details</a> · ${links}</div></td>`;
        return tr;
      };

      const toggleRow = (tr, open = !tr.classList.contains('open')) => {
        const current = tr.nextElementSibling?.classList.contains('detail')
          ? tr.nextElementSibling
          : null;
        tr.classList.toggle('open', open);
        if (!open) {
          current?.remove();
          return;
        }
        const entry = repoEntries().find(x => nameOf(x) === tr.dataset.repo);
        if (!entry) return;
        if (current) current.replaceWith(detailRow(entry));
        else tr.after(detailRow(entry));
      };

      const refreshOpenRows = () => {
        for (const tr of document.querySelectorAll('tr.repo.open')) toggleRow(tr, true);
      };

      const expandFromHash = () => {
        if (!location.hash) return;
        const tr = document.getElementById(location.hash.slice(1));
        if (tr?.classList.contains('repo')) toggleRow(tr, true);
      };

      // ─── Packages ────────────────────────────────────────────────────────────

      const COLUMNS = [
        {key: 'name', label: 'Package', value: r => r.name, text: true},
        {key: 'project', label: 'Project', value: r => r.project, text: true},
        {key: 'latest', label: 'Latest', value: r => r.published_at ?? '', text: true},
        {key: 'weekly', label: 'Weekly', value: r => r.week?.downloads ?? -1, n: true},
        {key: 'trend', label: '26 weeks'},
        {key: 'change', label: 'Δ 4 weeks', value: r => r.change?.ratio ?? -Infinity, n: true},
        {key: 'major', label: 'Latest major', value: r => r.latestMajorShare ?? -1, n: true},
        {
          key: 'dependents',
          label: 'Dependents',
          value: r => r.dependents?.direct ?? -1,
          n: true
        },
        {key: 'level', label: 'Level', value: r => r.level ?? -1, n: true},
        {key: 'collected', label: 'Collected', value: r => r.collected_at ?? '', text: true}
      ];

      const sortState = () => {
        try {
          const s = JSON.parse(localStorage.getItem(SORT_KEY));
          if (COLUMNS.some(c => c.key === s?.key && c.value)) return s;
        } catch {}
        return {key: 'weekly', dir: 'desc'};
      };

      const signedPercent = ratio =>
        typeof ratio === 'number'
          ? `${ratio > 0 ? '+' : ratio < 0 ? '−' : ''}${percent(Math.abs(ratio))}`
          : '-';
      const ageText = iso => {
        if (!iso) return '';
        const days = Math.floor((Date.now() - Date.parse(iso)) / DAY_MS);
        if (days < 60) return `${days}d`;
        if (days < 730) return `${Math.round(days / 30.44)} mo`;
        return `${Math.round(days / 365.25)} y`;
      };

      const renderPackages = () => {
        const all = packageRows(entries);
        const query = $('#filter').value.trim().toLowerCase();
        const rows = query
          ? all.filter(
              r => r.name.toLowerCase().includes(query) || r.project.toLowerCase().includes(query)
            )
          : all;
        const sort = sortState();
        const col = COLUMNS.find(c => c.key === sort.key);
        const sign = sort.dir === 'asc' ? 1 : -1;
        rows.sort((a, b) => {
          const x = col.value(a),
            y = col.value(b);
          const d = col.text ? String(x).localeCompare(String(y)) : x - y;
          return sign * d || a.name.localeCompare(b.name);
        });
        const weeks = new Set(all.map(r => r.week && `${r.week.start}:${r.week.end}`));
        const [start, end] = weeks.size === 1 ? ([...weeks][0]?.split(':') ?? []) : [];
        const cutoff = cutoffOf(windowState());
        const newest = all
          .map(r => r.collected_at)
          .sort()
          .pop();
        $('#table-meta').textContent = all.length
          ? `${plural(rows.length, 'package')}${query ? ` of ${all.length}` : ''} · ${start ? `downloads ${rangeLabel(start, end)}` : 'download weeks differ'} · collected ${short(newest)}`
          : '';
        if (!all.length) {
          $('#table').innerHTML =
            '<div class="empty">No stored packages — no <code>projects/*/state.md</code> carries a <code>## Packages</code> block yet. Run <code>fleet-status.mjs collect --fleet --packages-only</code>, then commit.</div>';
          return;
        }
        let weekly = 0;
        const body = rows.map(r => {
          weekly += r.week?.downloads ?? 0;
          const change = dependentsChange(r.dependents, cutoff);
          const trend = r.weekly.slice(-26);
          return `<tr>
            <td class="name"><a href="${projectHref(r.project, `pkg-${r.name}`)}" title="GitHub and npm details">${esc(r.name)}</a><a class="x" href="${esc(npmHref(r.name))}" target="_blank" rel="noopener">npm</a>${r.deprecated ? ' <span class="warn">deprecated</span>' : ''}</td>
            <td><a href="${projectHref(r.project)}">${esc(r.project)}</a></td>
            <td title="${esc(r.published_at ? `published ${dayLabel(r.published_at.slice(0, 10))}` : '')}">${esc(r.latest ?? '-')} <span class="quiet">${esc(ageText(r.published_at))}</span></td>
            <td class="n" title="${esc(r.week ? `${r.week.downloads.toLocaleString('en-US')} downloads, ${rangeLabel(r.week.start, r.week.end)}` : '')}">${esc(compact(r.week?.downloads))}</td>
            <td>${sparkline(trend, {label: `Weekly downloads, last ${trend.length} weeks, ending ${r.week ? dayLabel(r.week.end) : ''}`})}</td>
            <td class="n ${!r.change || r.change.noisy ? 'quiet' : ''}" title="${esc(r.change ? `${r.change.last.toLocaleString('en-US')} in the last 4 weeks against ${r.change.prev.toLocaleString('en-US')} before${r.change.noisy ? ' — under 5,000, mostly noise' : ''}` : '')}">${esc(signedPercent(r.change?.ratio))}</td>
            <td class="n ${r.latestMajorShare === null ? 'quiet' : ''}" title="${r.latestMajorShare === null ? ((r.week?.downloads ?? 0) < 100 ? 'under 100 downloads a week: the version split is not read' : 'no version split stored for this week') : ''}">${esc(percent(r.latestMajorShare))}</td>
            <td class="n" title="${esc(change ? `deps.dev direct dependents; ${change.delta >= 0 ? '+' : ''}${change.delta} since ${dayLabel(change.since)}${change.partial ? ' (tracking began then)' : ''}` : '')}">${esc(r.dependents ? r.dependents.direct.toLocaleString('en-US') : '-')}${change?.delta ? ` <span class="quiet">${change.delta > 0 ? '+' : '−'}${Math.abs(change.delta)}</span>` : ''}</td>
            <td class="n">${esc(r.level ?? '-')}</td>
            <td class="${isStale(r.collected_at) ? 'warn' : ''}" title="${esc(short(r.collected_at))}">${esc(monthDay(r.collected_at?.slice(0, 10)))}</td>
          </tr>`;
        });
        body.push(
          `<tr class="total"><td>Total (${rows.length})</td><td></td><td></td><td class="n" title="${esc(weekly.toLocaleString('en-US'))}">${esc(compact(weekly))}</td><td colspan="6"></td></tr>`
        );
        const head = COLUMNS.map(
          c =>
            `<th class="${c.n ? 'n ' : ''}${c.value ? 'sortable' : ''}" ${c.value ? `data-sort="${c.key}" aria-sort="${sort.key === c.key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}" tabindex="0"` : ''}>${esc(c.label)}${c.key === 'weekly' && start ? `<span class="sub">${esc(rangeLabel(start, end))}</span>` : ''}</th>`
        ).join('');
        $('#table').innerHTML =
          `<table><thead><tr>${head}</tr></thead><tbody>${body.join('')}</tbody></table>`;
      };

      // ─── Views ───────────────────────────────────────────────────────────────

      const renderView = () => {
        const view = viewState();
        for (const b of document.querySelectorAll('.switch button'))
          b.setAttribute('aria-pressed', String(b.dataset.view === view));
        $('#filter').hidden = view !== 'packages';
        if (view === 'packages') renderPackages();
        else renderRepos();
      };

      const load = async () => {
        if (!getToken()) {
          showAuthDialog();
          return;
        }
        $('#status').innerHTML = '';
        $('#brief').innerHTML = LOADING;
        $('#table').innerHTML = LOADING;
        try {
          const [text, list] = await Promise.all([
            api(`/vault/${DIGEST_PATH}`)
              .then(r => r.text())
              .catch(e => {
                if (e.message === 'not-found') return '';
                throw e;
              }),
            apiJson('/vault/projects/')
          ]);
          runs = parseRuns(text);
          renderBrief();
          const folders = (list.files ?? []).filter(f => f.endsWith('/')).map(f => f.slice(0, -1));
          const found = await Promise.all(
            folders.map(async project => {
              try {
                const res = await api(`/vault/${stateDocPath(encodeURIComponent(project))}`);
                const doc = await res.text();
                const baseline = parseBaseline(doc),
                  packages = parsePackages(doc);
                return baseline || packages ? {project, baseline, packages} : null;
              } catch (e) {
                if (e.message === 'not-found') return null;
                throw e;
              }
            })
          );
          entries = found
            .filter(Boolean)
            .sort((a, b) =>
              (a.baseline?.repo ?? a.project).localeCompare(b.baseline?.repo ?? b.project)
            );
          renderView();
          const packages = packageRows(entries).length;
          $('#footer').textContent =
            `${plural(repoEntries().length, 'baseline')} · ${plural(packages, 'package')} · ${plural(runs.length, 'stored run')}${runs.length ? ` · newest ${short(runs[0].collected_at)}` : ''}`;
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') {
            showAuthDialog();
            return;
          }
          $('#status').innerHTML = `<div class="err">${esc(e.message)}</div>`;
        }
      };

      const sel = $('#window');
      sel.innerHTML = WINDOWS.map(([v, label]) => `<option value="${v}">${label}</option>`).join(
        ''
      );
      sel.value = windowState();
      sel.addEventListener('change', () => {
        localStorage.setItem(WINDOW_KEY, sel.value);
        renderBrief();
        if (viewState() === 'packages') renderPackages();
        else refreshOpenRows();
      });

      document.querySelector('.switch').addEventListener('click', e => {
        const b = e.target.closest('button[data-view]');
        if (!b) return;
        const url = new URL(location.href);
        if (b.dataset.view === 'packages') url.searchParams.set(VIEW_PARAM, 'packages');
        else url.searchParams.delete(VIEW_PARAM);
        url.hash = '';
        history.replaceState(null, '', url);
        renderView();
      });
      $('#filter').addEventListener('input', renderPackages);

      const sortBy = th => {
        const s = sortState();
        const key = th.dataset.sort;
        const col = COLUMNS.find(c => c.key === key);
        const dir = s.key === key ? (s.dir === 'asc' ? 'desc' : 'asc') : col.text ? 'asc' : 'desc';
        localStorage.setItem(SORT_KEY, JSON.stringify({key, dir}));
        renderPackages();
      };

      // Delegated: the tables and the brief re-render, their containers don't.
      $('#table').addEventListener('click', e => {
        const th = e.target.closest('th[data-sort]');
        if (th) return sortBy(th);
        const td = e.target.closest('tr.repo td.name');
        if (td) toggleRow(td.closest('tr'));
      });
      $('#table').addEventListener('keydown', e => {
        const th = e.target.closest('th[data-sort]');
        if (th && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          sortBy(th);
        }
      });
      window.addEventListener('hashchange', expandFromHash);
      document.addEventListener('token-change', load);

      load();
    </script>
    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/theme.js"></script>
  </body>
</html>

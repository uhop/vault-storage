<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>vault-storage — fleet</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      main {
        max-width: 80rem;
      }
      h2 {
        font-size: 1rem;
        margin: 0;
      }
      code {
        font-family: var(--mono);
        font-size: 0.9em;
      }
      .glance {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .glance li {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.15rem 1.1rem;
        padding: 0.35rem 0;
        border-bottom: 1px solid var(--line);
      }
      .glance li.fresh,
      .legend-line {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .glance li.fresh {
        padding-left: 0.6rem;
      }
      .glance li.fresh .repo {
        font-weight: 600;
      }
      .legend-line {
        font-family: var(--mono);
        font-weight: 600;
        padding: 0 0.4rem 0 0.6rem;
      }
      .glance .repo {
        font-family: var(--mono);
        min-width: 13rem;
      }
      .glance .group {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: baseline;
      }
      .glance .label {
        color: var(--muted);
        font-size: 0.8rem;
        margin-right: 0.35rem;
      }
      .quiet-list summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 0.9rem;
        padding: 0.45rem 0;
      }
      .quiet-list .names {
        font-size: 0.85rem;
        line-height: 1.8;
      }
      td.name .fmw-pill {
        margin-left: 0.3rem;
        vertical-align: 0.1em;
      }
      th.sortable {
        cursor: pointer;
        user-select: none;
      }
      th.sortable:hover {
        color: var(--fg);
      }
      th[aria-sort='ascending']::after {
        content: ' ▲';
        font-size: 0.7em;
      }
      th[aria-sort='descending']::after {
        content: ' ▼';
        font-size: 0.7em;
      }
      th .sub {
        display: block;
        font-size: 0.75rem;
        font-weight: 400;
      }
      td.name {
        font-family: var(--mono);
      }
      .empty {
        padding: 0.8rem 0;
        text-align: start;
      }
      .err {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body class="fmw">
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <main>
      <div id="status"></div>
      <div class="fmw-bar controls">
        <vault-switch id="view-switch" param="view" default="glance" aria-label="View">
          <button data-value="glance">At a glance</button>
          <button data-value="repos">Repositories</button>
          <button data-value="packages">Packages</button>
        </vault-switch>
        <label id="window-label"
          >activity since
          <select id="window"></select
        ></label>
        <small id="view-meta"></small>
      </div>
      <section id="glance-view">
        <div class="fmw-bar">
          <h2>At a glance</h2>
          <small id="glance-meta"></small>
          <vault-legend view="glance"></vault-legend>
        </div>
        <div id="glance"></div>
      </section>
      <section id="tables" hidden>
        <div class="fmw-bar">
          <h2 id="table-title">Repositories</h2>
          <input type="search" id="filter" placeholder="filter packages" hidden />
          <small id="table-meta"></small>
          <vault-legend id="table-legend" view="repos"></vault-legend>
        </div>
        <div class="fmw-scroll" id="table"></div>
      </section>
    </main>
    <div class="footer" id="footer"></div>

    <script type="module">
      import {api, apiJson, esc, getToken, showAuthDialog} from '/ui/api.js';
      import {
        stateDocPath,
        parseBaseline,
        parsePackages,
        parseWhen,
        repoGlance,
        packageMovement,
        baselineRow,
        alertText,
        plural,
        short,
        packageRows,
        dependentsChange,
        compact,
        percent,
        majorOf,
        wholeShare
      } from '/ui/fleet-digest.js';
      import {
        WINDOWS,
        WINDOW_KEY,
        windowState,
        isStale,
        ext,
        projectHref,
        npmHref
      } from '/ui/fleet-view.js';
      import {chip, bindPopovers} from '/ui/fleet-popover.js';
      import {sparkline, rangeLabel, dayLabel, monthDay} from '/ui/fleet-charts.js';

      const VIEW_PARAM = 'view';
      const SORT_KEY = 'vault.fleet.packages.sort';
      const LOADING = '<div class="empty"><span class="spinner"></span> loading…</div>';
      const DAY_MS = 864e5;
      const $ = sel => document.querySelector(sel);

      let entries = [];

      const cutoffOf = w => (w === 'all' ? null : parseWhen(w));
      const VIEWS = ['glance', 'repos', 'packages'];
      const viewState = () => {
        const v = new URLSearchParams(location.search).get(VIEW_PARAM);
        return VIEWS.includes(v) ? v : 'glance';
      };

      // ─── At a glance ─────────────────────────────────────────────────────────
      // One line per project with something open or moving: item numbers as
      // chips, details on hover or tap. Quiet repositories fold into one line.

      const MAX_CHIPS = 6;
      const when = iso => (iso ? dayLabel(iso.slice(0, 10)) : '');
      const KINDS = {
        issue: ['issue', 'issues'],
        pr: ['PR', 'PRs'],
        discussion: ['discussion', 'discussions']
      };
      const byProject = (a, b) => a.project.localeCompare(b.project);
      const signed = n => `${n > 0 ? '+' : '−'}${Math.abs(n).toLocaleString('en-US')}`;

      const answerLines = it => {
        if (it.bot) return [];
        const how = [
          it.owner_commented === true && 'you commented',
          it.owner_reacted === true && 'you reacted',
          (it.assignees?.length ?? 0) > 0 && `assigned to ${it.assignees.join(', ')}`
        ].filter(Boolean);
        if (how.length) return [how.join('; ')];
        return it.fresh ? ['new: no reaction, comment, or assignee from you yet'] : [];
      };

      const itemPop = (it, kind) => {
        const comments = (it.comments ?? 0) + (it.review_comments ?? 0),
          reactions = (it.reactions ?? 0) + (it.comment_reactions ?? 0),
          last = it.last_comment;
        return {
          title: `#${it.number} ${it.title}`,
          lines: [
            `${KINDS[kind][0]} by ${it.author ?? 'unknown'}${it.bot ? ' (bot)' : ''}, opened ${when(it.created_at)}${it.draft ? ', draft' : ''}${it.category ? `, ${it.category}` : ''}${it.answered ? ', answered' : ''}`,
            ...answerLines(it),
            comments
              ? `${plural(comments, 'comment')}${last?.author ? `, the last by ${last.author} on ${when(last.at)}` : ''}`
              : 'no comments',
            ...(reactions ? [plural(reactions, 'reaction')] : []),
            ...(it.labels?.length ? [`labels: ${it.labels.join(', ')}`] : []),
            ...(last?.excerpt ? [`last comment: "${last.excerpt}"`] : [])
          ],
          quote: it.excerpt ?? '',
          links: [{text: 'Open on GitHub', href: it.html_url ?? it.url}]
        };
      };

      const group = (label, chips) =>
        chips ? `<span class="group"><span class="label">${esc(label)}</span>${chips}</span>` : '';

      const itemGroup = (items, kind) => {
        if (!items.length) return '';
        // New, unanswered items lead, so the "+N" overflow never hides one.
        const list = [...items].sort((a, b) => Number(b.fresh) - Number(a.fresh));
        const shown = list.slice(0, MAX_CHIPS),
          rest = list.slice(MAX_CHIPS);
        const chips = shown
          .map(it =>
            chip(
              `#${it.number}`,
              itemPop(it, kind),
              [
                it.fresh && 'new',
                it.bot && 'bot',
                it.draft && 'draft',
                it.active && 'active'
              ].filter(Boolean)
            )
          )
          .join('');
        const more = rest.length
          ? chip(
              `+${rest.length}`,
              {
                title: `${rest.length} more ${KINDS[kind][rest.length === 1 ? 0 : 1]}`,
                lines: rest.map(it => `#${it.number} ${it.title}`),
                links: rest.map(it => ({text: `#${it.number}`, href: it.html_url ?? it.url}))
              },
              [rest.some(it => it.fresh) && 'new', rest.some(it => it.active) && 'active'].filter(
                Boolean
              )
            )
          : '';
        return group(KINDS[kind][list.length === 1 ? 0 : 1], chips + more);
      };

      // An advisory with its CVE is settled; the project page keeps the full list.
      const securityGroup = g => {
        const chips = g.advisories
          .filter(a => a.noCve || a.pending)
          .map(a =>
            chip(
              a.id.replace(/^(GHSA-[^-]+)-.*$/, '$1'),
              {
                title: a.summary ?? a.id,
                lines: [
                  `${a.id}: ${a.state}${a.severity ? `, ${a.severity} severity` : ''}`,
                  a.cve_id ?? (a.state === 'published' ? 'no CVE yet' : 'not published yet'),
                  ...(a.published_at ? [`published ${when(a.published_at)}`] : [])
                ],
                links: [{text: 'Open on GitHub', href: a.html_url}]
              },
              [(a.noCve || a.pending) && 'warn', a.active && 'active'].filter(Boolean)
            )
          );
        for (const [key, label, tab] of [
          ['dependabot', 'Dependabot', 'dependabot'],
          ['codeScanning', 'code scanning', 'code-scanning']
        ]) {
          const alert = g.alerts[key];
          if (!alert?.open) continue;
          const count = `${alert.truncated ? '≥' : ''}${alert.open}`;
          chips.push(
            chip(
              `${label} ${count}`,
              {
                title: `${count} open ${label} alerts`,
                lines: [
                  ...(alert.truncated
                    ? [`Counting stopped at ${alert.open}; the severities cover those only.`]
                    : []),
                  ...alert.severities
                ],
                links: [
                  {
                    text: 'Open on GitHub',
                    href: g.html_url ? `${g.html_url}/security/${tab}` : null
                  }
                ]
              },
              ['warn']
            )
          );
        }
        return group('security', chips.join(''));
      };

      const ciGroup = g =>
        g.ciFailing
          ? group(
              'CI',
              chip(
                g.ci.state,
                {
                  title: `${g.ci.name}: ${g.ci.state}`,
                  lines: [`last run ${when(g.ci.updated_at)}`],
                  links: [{text: 'Open the run', href: g.ci.html_url}]
                },
                ['bad']
              )
            )
          : '';

      const npmGroups = (project, movement) =>
        movement
          .map(m => {
            const details = {text: 'Package details', href: projectHref(project, `pkg-${m.name}`)};
            const chips = [
              ...m.publishes.map(([day, version]) =>
                chip(version, {
                  title: `${m.name} ${version}`,
                  lines: [`published ${when(day)}`],
                  links: [
                    {text: 'npm', href: `https://www.npmjs.com/package/${m.name}/v/${version}`},
                    details
                  ]
                })
              ),
              ...(m.dependents
                ? [
                    chip(`dependents ${signed(m.dependents.delta)}`, {
                      title: `${m.name}: ${m.dependents.now.toLocaleString('en-US')} direct dependents`,
                      lines: [
                        `${signed(m.dependents.delta)} since ${when(m.dependents.since)}, from deps.dev`
                      ],
                      links: [details]
                    })
                  ]
                : [])
            ].join('');
            return group(m.name === project ? 'npm' : `npm ${m.name}`, chips);
          })
          .join('');

      const renderGlance = () => {
        const cutoff = cutoffOf(windowState());
        const wasOpen = Boolean($('#glance .quiet-list')?.open);
        const lines = [],
          quiet = [];
        for (const e of [...entries].sort(byProject)) {
          const g = e.baseline ? repoGlance(e.baseline, cutoff) : null;
          const movement = packageMovement(e.packages, cutoff);
          if (!g?.attention && !movement.length) {
            if (g) quiet.push(e);
            continue;
          }
          const info = g
            ? `${plural(g.stars ?? 0, 'star')}, ${plural(g.forks ?? 0, 'fork')}, ${plural(g.watchers ?? 0, 'watcher')} · GitHub collected ${short(g.collected_at)}`
            : 'no public fleet repository; npm only';
          const fresh = g?.freshCount ?? 0;
          lines.push({
            fresh,
            html: `<li${fresh ? ' class="fresh"' : ''}><a class="repo" href="${projectHref(e.project)}" title="${esc(info)}">${esc(e.project)}</a>${
              g && isStale(g.collected_at) ? '<span class="fmw-warn">stale</span>' : ''
            }${
              g
                ? itemGroup(g.issues, 'issue') +
                  itemGroup(g.prs, 'pr') +
                  itemGroup(g.discussions, 'discussion') +
                  securityGroup(g) +
                  ciGroup(g)
                : ''
            }${npmGroups(e.project, movement)}</li>`
          });
        }
        // Stable: repositories with a new, unanswered item first, each group by name.
        lines.sort((a, b) => Number(b.fresh > 0) - Number(a.fresh > 0));
        const freshRepos = lines.filter(l => l.fresh > 0).length;
        $('#glance-meta').textContent =
          `${freshRepos ? `${freshRepos} with new items from people · ` : ''}${lines.length} with something open or moving${
            cutoff ? ` · a dot marks activity since ${when(cutoff)}` : ''
          }`;
        const folded = quiet.length
          ? `<details class="quiet-list"${wasOpen ? ' open' : ''}><summary>${esc(plural(quiet.length, 'repository', 'repositories'))} with nothing open</summary><div class="names">${quiet
              .map(e => `<a href="${projectHref(e.project)}">${esc(e.project)}</a>`)
              .join(' · ')}</div></details>`
          : '';
        $('#glance').innerHTML = lines.length
          ? `<ul class="glance">${lines.map(l => l.html).join('')}</ul>${folded}`
          : `<div class="empty">Nothing open or moving.</div>${folded}`;
      };

      // ─── Repositories ────────────────────────────────────────────────────────

      // A zero count prints nothing: an empty cell reads as "none" without adding ink.
      const count = n => (n === 0 ? '&nbsp;' : esc(n));
      const numCell = (n, cls = '') => `<td class="n ${cls}">${count(n)}</td>`;
      const alertCell = a =>
        `<td class="n ${!a ? 'fmw-quiet' : a.open > 0 ? 'fmw-warn' : ''}" title="${esc(
          a
            ? (a.truncated ? `counting stopped at ${a.open}: ` : '') +
                (Object.entries(a.by_severity)
                  .map(([k, n]) => `${n} ${k}`)
                  .join(', ') || 'no open alerts')
            : 'not available'
        )}">${a?.open === 0 ? '&nbsp;' : esc(alertText(a))}</td>`;
      const ciClass = ci =>
        !ci
          ? 'fmw-quiet'
          : ci.state === 'success'
            ? 'fmw-ok'
            : ci.state === 'failure'
              ? 'fmw-bad'
              : 'fmw-warn';
      const ciCell = ci =>
        `<td class="${ciClass(ci)}" title="${esc(ci ? `${ci.name}, ${short(ci.updated_at)}` : 'no workflow run recorded')}">${
          ci ? (ci.html_url ? ext(ci.html_url, ci.state, ciClass(ci)) : esc(ci.state)) : 'none'
        }</td>`;

      const repoEntries = () => entries.filter(e => e.baseline);

      const renderRepos = () => {
        const list = repoEntries().sort(byProject);
        $('#table-meta').textContent =
          `${plural(list.length, 'repository', 'repositories')} with a stored baseline · ${plural(entries.length, 'project')} with stored fleet data`;
        if (!list.length) {
          $('#table').innerHTML =
            '<div class="empty">No stored baselines — no <code>projects/*/state.md</code> carries a <code>## GitHub</code> block yet.</div>';
          return;
        }
        const sum = {issues: 0, prs: 0, stars: 0, forks: 0};
        const sorted = list.map(entry => ({
          project: entry.project,
          entry,
          r: baselineRow(entry.baseline)
        }));
        const sort = sortRows('repos', sorted);
        const rows = sorted.map(({entry, r}) => {
          sum.issues += r.issues;
          sum.prs += r.prs;
          sum.stars += r.stars ?? 0;
          sum.forks += r.forks ?? 0;
          return `<tr>
            <td class="name"><a href="${projectHref(entry.project)}" title="GitHub and npm details">${esc(entry.project)}</a></td>
            ${numCell(r.issues)}${numCell(r.prs)}
            <td class="n ${r.hasDiscussions ? '' : 'fmw-quiet'}">${r.hasDiscussions ? count(r.discussions) : '-'}</td>
            ${numCell(r.stars ?? '-')}${numCell(r.forks ?? '-')}
            <td class="n ${r.noCve ? 'fmw-warn' : ''}">${count(r.advisories)}${r.noCve ? ` (${r.noCve} no CVE)` : ''}</td>
            ${alertCell(r.dependabot)}${alertCell(r.codeScanning)}
            ${ciCell(r.ci)}
            <td class="${isStale(r.collected_at) ? 'fmw-warn' : ''}" title="${esc(r.collected_at ?? '')}">${esc(short(r.collected_at))}</td>
          </tr>`;
        });
        rows.push(
          `<tr class="total"><td>Total (${list.length})</td>${numCell(sum.issues)}${numCell(sum.prs)}<td></td>${numCell(sum.stars)}${numCell(sum.forks)}<td colspan="5"></td></tr>`
        );
        $('#table').innerHTML =
          `<table class="fmw-table wide"><thead><tr>${headRow('repos', sort)}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
      };

      // ─── Packages ────────────────────────────────────────────────────────────

      const PACKAGE_COLUMNS = [
        {key: 'name', label: 'Package', value: r => r.name, text: true},
        {key: 'project', label: 'Project', value: r => r.project, text: true},
        {key: 'latest', label: 'Latest', value: r => r.published_at ?? '', text: true},
        {key: 'weekly', label: 'Weekly', value: r => r.week?.downloads ?? -1, n: true},
        {key: 'trend', label: '26 weeks'},
        {key: 'change', label: 'Δ 4 weeks', value: r => r.change?.ratio ?? -Infinity, n: true},
        {
          key: 'major',
          label: 'Latest\nmajor',
          value: r => (wholeShare(r.latestMajorShare) ? -0.5 : (r.latestMajorShare ?? -1)),
          n: true
        },
        {
          key: 'version',
          label: 'Latest\nversion',
          value: r => r.latestVersionShare?.share ?? -1,
          n: true
        },
        {
          key: 'dependents',
          label: 'Dependents',
          value: r => r.dependents?.direct ?? -1,
          n: true
        },
        {key: 'level', label: 'Level', value: r => r.level ?? -1, n: true},
        {key: 'collected', label: 'Collected', value: r => r.collected_at ?? '', text: true}
      ];

      const splitNote = r =>
        (r.week?.downloads ?? 0) < 100
          ? 'under 100 downloads a week: the version split is not read'
          : 'no version split stored for this week';
      const majorCell = r => {
        const share = r.latestMajorShare;
        if (share === null) return `<td class="n fmw-quiet" title="${esc(splitNote(r))}">-</td>`;
        if (wholeShare(share))
          return `<td class="n" title="${esc(`${majorOf(r.latest)}.x carries all downloads, to the nearest percent`)}">&nbsp;</td>`;
        return `<td class="n">${esc(percent(share))}</td>`;
      };
      const versionCell = r => {
        const v = r.latestVersionShare;
        if (v === null) return `<td class="n fmw-quiet" title="${esc(splitNote(r))}">-</td>`;
        if (v.share === 0)
          return `<td class="n" title="${esc(`no downloads of ${r.latest} that week`)}">&nbsp;</td>`;
        const title = v.atMost
          ? `${r.latest} is not among the five most downloaded versions`
          : `${r.latest}: ${percent(v.share)} of the week's downloads`;
        return `<td class="n" title="${esc(title)}">${esc(`${v.atMost ? '≤' : ''}${percent(v.share)}`)}</td>`;
      };

      const REPO_COLUMNS = [
        {key: 'name', label: 'Repository', value: x => x.project, text: true},
        {key: 'issues', label: 'Issues', value: x => x.r.issues, n: true},
        {key: 'prs', label: 'PRs', value: x => x.r.prs, n: true},
        {
          key: 'discussions',
          label: 'Discussions',
          value: x => (x.r.hasDiscussions ? x.r.discussions : -1),
          n: true
        },
        {key: 'stars', label: 'Stars', value: x => x.r.stars ?? -1, n: true},
        {key: 'forks', label: 'Forks', value: x => x.r.forks ?? -1, n: true},
        {key: 'advisories', label: 'Advisories', value: x => x.r.advisories, n: true},
        {key: 'dependabot', label: 'Dependabot', value: x => x.r.dependabot?.open ?? -1, n: true},
        {key: 'scanning', label: 'Scanning', value: x => x.r.codeScanning?.open ?? -1, n: true},
        {key: 'ci', label: 'CI', value: x => x.r.ci?.state ?? '', text: true},
        {key: 'collected', label: 'Collected', value: x => x.r.collected_at ?? '', text: true}
      ];

      // One sort per table, remembered per viewer; a column without a value does not sort.
      const TABLES = {
        repos: {
          columns: REPO_COLUMNS,
          storage: 'vault.fleet.repos.sort',
          fallback: {key: 'name', dir: 'asc'},
          tie: x => x.project
        },
        packages: {
          columns: PACKAGE_COLUMNS,
          storage: SORT_KEY,
          fallback: {key: 'weekly', dir: 'desc'},
          tie: x => x.name
        }
      };

      const sortState = table => {
        const t = TABLES[table];
        try {
          const s = JSON.parse(localStorage.getItem(t.storage));
          if (t.columns.some(c => c.key === s?.key && c.value)) return s;
        } catch {}
        return t.fallback;
      };

      const sortRows = (table, rows) => {
        const t = TABLES[table],
          sort = sortState(table);
        const col = t.columns.find(c => c.key === sort.key);
        const sign = sort.dir === 'asc' ? 1 : -1;
        rows.sort((a, b) => {
          const x = col.value(a),
            y = col.value(b);
          const d = col.text ? String(x).localeCompare(String(y)) : x - y;
          return sign * d || t.tie(a).localeCompare(t.tie(b));
        });
        return sort;
      };

      const headRow = (table, sort, extra = () => '') =>
        TABLES[table].columns
          .map(
            c =>
              `<th class="${c.n ? 'n ' : ''}${c.value ? 'sortable' : ''}" ${c.value ? `data-table="${table}" data-sort="${c.key}" aria-sort="${sort.key === c.key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}" tabindex="0"` : ''}>${c.label.split('\n').map(esc).join('<br>')}${extra(c)}</th>`
          )
          .join('');

      const signedPercent = ratio =>
        typeof ratio === 'number'
          ? `${ratio > 0 ? '+' : ratio < 0 ? '−' : ''}${percent(Math.abs(ratio))}`
          : '-';
      const ageText = iso => {
        if (!iso) return '';
        const days = Math.floor((Date.now() - Date.parse(iso)) / DAY_MS);
        if (days < 60) return `${days}d`;
        if (days < 730) return `${Math.round(days / 30.44)} mo`;
        return `${Math.round(days / 365.25)} y`;
      };

      const renderPackages = () => {
        const all = packageRows(entries);
        const query = $('#filter').value.trim().toLowerCase();
        const rows = query
          ? all.filter(
              r => r.name.toLowerCase().includes(query) || r.project.toLowerCase().includes(query)
            )
          : all;
        const sort = sortRows('packages', rows);
        const weeks = new Set(all.map(r => r.week && `${r.week.start}:${r.week.end}`));
        const [start, end] = weeks.size === 1 ? ([...weeks][0]?.split(':') ?? []) : [];
        const cutoff = cutoffOf(windowState());
        const newest = all
          .map(r => r.collected_at)
          .sort()
          .pop();
        $('#table-meta').textContent = all.length
          ? `${plural(rows.length, 'package')}${query ? ` of ${all.length}` : ''} · ${start ? `downloads ${rangeLabel(start, end)}` : 'download weeks differ'} · collected ${short(newest)}`
          : '';
        if (!all.length) {
          $('#table').innerHTML =
            '<div class="empty">No stored packages — no <code>projects/*/state.md</code> carries a <code>## Packages</code> block yet. Run <code>fleet-status.mjs collect --fleet --packages-only</code>, then commit.</div>';
          return;
        }
        let weekly = 0;
        const body = rows.map(r => {
          weekly += r.week?.downloads ?? 0;
          const change = dependentsChange(r.dependents, cutoff);
          const trend = r.weekly.slice(-26);
          return `<tr>
            <td class="name"><a href="${projectHref(r.project, `pkg-${r.name}`)}" title="GitHub and npm details">${esc(r.name)}</a><a class="fmw-pill" href="${esc(npmHref(r.name))}" target="_blank" rel="noopener">npm</a>${r.deprecated ? ' <span class="fmw-warn">deprecated</span>' : ''}</td>
            <td><a href="${projectHref(r.project)}">${esc(r.project)}</a></td>
            <td title="${esc(r.published_at ? `published ${dayLabel(r.published_at.slice(0, 10))}` : '')}">${esc(r.latest ?? '-')} <span class="fmw-quiet">${esc(ageText(r.published_at))}</span></td>
            <td class="n" title="${esc(r.week ? `${r.week.downloads.toLocaleString('en-US')} downloads, ${rangeLabel(r.week.start, r.week.end)}` : '')}">${r.week?.downloads === 0 ? '&nbsp;' : esc(compact(r.week?.downloads))}</td>
            <td>${sparkline(trend, {label: `Weekly downloads, last ${trend.length} weeks, ending ${r.week ? dayLabel(r.week.end) : ''}`})}</td>
            <td class="n ${!r.change || r.change.noisy ? 'fmw-quiet' : ''}" title="${esc(r.change ? `${r.change.last.toLocaleString('en-US')} in the last 4 weeks against ${r.change.prev.toLocaleString('en-US')} before${r.change.noisy ? ' — under 5,000, mostly noise' : ''}` : '')}">${esc(signedPercent(r.change?.ratio))}</td>
            ${majorCell(r)}
            ${versionCell(r)}
            <td class="n" title="${esc(change ? `deps.dev direct dependents; ${change.delta >= 0 ? '+' : ''}${change.delta} since ${dayLabel(change.since)}${change.partial ? ' (tracking began then)' : ''}` : '')}">${r.dependents ? count(r.dependents.direct) : '-'}${change?.delta ? ` <span class="fmw-quiet">${change.delta > 0 ? '+' : '−'}${Math.abs(change.delta)}</span>` : ''}</td>
            <td class="n">${esc(r.level ?? '-')}</td>
            <td class="${isStale(r.collected_at) ? 'fmw-warn' : ''}" title="${esc(short(r.collected_at))}">${esc(monthDay(r.collected_at?.slice(0, 10)))}</td>
          </tr>`;
        });
        body.push(
          `<tr class="total"><td>Total (${rows.length})</td><td></td><td></td><td class="n" title="${esc(weekly.toLocaleString('en-US'))}">${esc(compact(weekly))}</td><td colspan="7"></td></tr>`
        );
        const head = headRow('packages', sort, c =>
          c.key === 'weekly' && start
            ? `<span class="sub">${esc(rangeLabel(start, end))}</span>`
            : ''
        );
        $('#table').innerHTML =
          `<table class="fmw-table wide"><thead><tr>${head}</tr></thead><tbody>${body.join('')}</tbody></table>`;
      };

      // ─── Views ───────────────────────────────────────────────────────────────

      const renderView = () => {
        const view = viewState();
        $('#view-switch').value = view;
        $('#glance-view').hidden = view !== 'glance';
        $('#tables').hidden = view === 'glance';
        $('#window-label').hidden = view === 'repos';
        $('#table-title').textContent = view === 'packages' ? 'Packages' : 'Repositories';
        $('#table-legend').view = view === 'packages' ? 'packages' : 'repos';
        $('#filter').hidden = view !== 'packages';
        if (view === 'glance') renderGlance();
        else if (view === 'packages') renderPackages();
        else renderRepos();
      };

      const load = async () => {
        if (!getToken()) {
          showAuthDialog();
          return;
        }
        $('#status').innerHTML = '';
        $('#glance').innerHTML = LOADING;
        $('#table').innerHTML = LOADING;
        try {
          const list = await apiJson('/vault/projects/');
          const folders = (list.files ?? []).filter(f => f.endsWith('/')).map(f => f.slice(0, -1));
          const found = await Promise.all(
            folders.map(async project => {
              try {
                const res = await api(`/vault/${stateDocPath(encodeURIComponent(project))}`);
                const doc = await res.text();
                const baseline = parseBaseline(doc),
                  packages = parsePackages(doc);
                return baseline || packages ? {project, baseline, packages} : null;
              } catch (e) {
                if (e.message === 'not-found') return null;
                throw e;
              }
            })
          );
          entries = found.filter(Boolean);
          renderView();
          const repos = repoEntries(),
            rows = packageRows(entries);
          const newest = list => list.filter(Boolean).sort().pop();
          $('#view-meta').textContent =
            `${plural(repos.length, 'repository', 'repositories')}, GitHub collected ${short(newest(repos.map(e => e.baseline.collected_at)))} · ${plural(rows.length, 'package')}, npm collected ${short(newest(rows.map(r => r.collected_at)))}`;
          $('#footer').textContent =
            `${plural(repos.length, 'baseline')} · ${plural(rows.length, 'package')}`;
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') {
            showAuthDialog();
            return;
          }
          $('#status').innerHTML = `<div class="err">${esc(e.message)}</div>`;
        }
      };

      const sel = $('#window');
      sel.innerHTML = WINDOWS.map(([v, label]) => `<option value="${v}">${label}</option>`).join(
        ''
      );
      sel.value = windowState();
      sel.addEventListener('change', () => {
        localStorage.setItem(WINDOW_KEY, sel.value);
        renderView();
      });

      // The switch wrote ?view= before dispatching; the menu and the view read it back.
      $('#view-switch').addEventListener('change', () => {
        document.querySelector('vault-nav')?.refresh?.();
        renderView();
      });
      $('#filter').addEventListener('input', renderPackages);

      const sortBy = th => {
        const table = th.dataset.table,
          key = th.dataset.sort;
        const s = sortState(table),
          col = TABLES[table].columns.find(c => c.key === key);
        const dir = s.key === key ? (s.dir === 'asc' ? 'desc' : 'asc') : col.text ? 'asc' : 'desc';
        try {
          localStorage.setItem(TABLES[table].storage, JSON.stringify({key, dir}));
        } catch {}
        if (table === 'repos') renderRepos();
        else renderPackages();
      };

      // Delegated: the table re-renders, its container doesn't.
      $('#table').addEventListener('click', e => {
        const th = e.target.closest('th[data-sort]');
        if (th) sortBy(th);
      });
      $('#table').addEventListener('keydown', e => {
        const th = e.target.closest('th[data-sort]');
        if (th && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          sortBy(th);
        }
      });
      bindPopovers($('#glance'));
      document.addEventListener('token-change', load);

      load();
    </script>
    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/components/vault-legend.js"></script>
    <script type="module" src="/ui/components/vault-switch.js"></script>
    <script type="module" src="/ui/theme.js"></script>
  </body>
</html>

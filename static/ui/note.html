<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
    </script>
    <script>
      // api() adopts these by exact URL: keep them in step with the page's own first requests.
      (() => {
        performance.mark('head script');
        const token = localStorage.getItem('vault.token');
        const path = new URLSearchParams(location.search).get('path');
        if (!token || !path) return;
        const urls = [`/vault/${path.split('/').map(encodeURIComponent).join('/')}?render=html`];
        const early = (window.__early ??= new Map());
        for (const url of urls) {
          const res = fetch(url, {headers: {Authorization: `Bearer ${token}`}});
          res.catch(() => {});
          early.set(url, res);
        }
      })();
    </script>
    <title>vault-storage — note</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .toolbar .path {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 0.85rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toolbar a.button {
        display: inline-block;
        padding: 0.45rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        background: var(--card);
        color: var(--fg);
        font-size: 0.9rem;
        text-decoration: none;
      }
      .toolbar a.button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .toolbar a.button[hidden] {
        display: none;
      }
      #doc :is(h1, h2, h3, h4, h5, h6) {
        scroll-margin-top: 4rem;
      }
      #doc :is(h1, h2, h3, h4, h5, h6) > .fmw-pill {
        margin-left: 0.5rem;
        vertical-align: middle;
      }
      /* The pill's own ink: the prose part's link rule would paint it accent. */
      #doc .fmw-pill {
        color: var(--muted);
        text-decoration: none;
      }
      #doc .fmw-pill:hover {
        color: var(--fg);
      }
      #doc .fm > summary {
        margin-bottom: 0.6rem;
        font-family: var(--mono);
        font-size: var(--text-s);
        color: var(--muted);
        cursor: pointer;
      }
      #doc .fm > summary > .fmw-pill {
        margin-left: 0.5rem;
      }
      .find-bar {
        position: absolute;
        top: calc(100% + 0.4rem);
        right: 1rem;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.5rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
      }
      .find-bar[hidden] {
        display: none;
      }
      .find-bar input {
        width: 14rem;
        padding: 0.35rem 0.5rem;
        font: inherit;
        font-size: 0.85rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        background: var(--bg);
        color: var(--fg);
      }
      .find-bar input.no-match {
        border-color: var(--bad);
      }
      .find-bar button {
        padding: 0.3rem 0.5rem;
        font-size: 0.8rem;
        line-height: 1;
      }
      .find-bar button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .find-count {
        min-width: 4rem;
        font-size: 0.75rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      @media (max-width: 600px) {
        .toolbar .path {
          flex-basis: 100%;
        }
        .find-bar {
          left: 0.6rem;
          right: 0.6rem;
        }
        .find-bar input {
          width: auto;
          flex: 1;
          min-width: 0;
        }
      }
      /* Both colors forced: a theme-inherited light text over yellow is unreadable. */
      ::highlight(vault-find) {
        background-color: #ffd54a;
        color: #1a1a1a;
      }
      ::highlight(vault-find-current) {
        background-color: var(--accent);
        color: #fff;
      }
      dialog .fmw-records {
        margin: 0 0 0.8rem;
        max-height: 60vh;
        overflow-y: auto;
      }
    </style>
  </head>
  <body class="fmw">
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <div class="toolbar">
      <span class="path" id="path"></span>
      <a class="button" id="edit" hidden>Edit</a>
      <button id="outline" hidden title="Outline (jump to heading)">Outline</button>
      <button id="find-btn" hidden title="Find (⌘F)">Find</button>
      <button id="backlinks" hidden title="Notes that link to this one">Backlinks</button>
      <div id="find-bar" class="find-bar" hidden role="search" aria-label="Find in note">
        <input
          id="find-input"
          type="text"
          placeholder="Find"
          autocomplete="off"
          spellcheck="false"
        />
        <span id="find-count" class="find-count" aria-live="polite"></span>
        <button id="find-prev" type="button" title="Previous match (⇧⏎)">↑</button>
        <button id="find-next" type="button" title="Next match (⏎)">↓</button>
        <button id="find-case" type="button" aria-pressed="false" title="Match case">Aa</button>
        <button id="find-close" type="button" title="Close (Esc)">✕</button>
      </div>
    </div>
    <main>
      <div class="err" id="err" hidden></div>
      <article class="fmw-prose" id="doc">
        <div class="empty"><span class="spinner"></span> loading…</div>
      </article>
    </main>

    <dialog id="backlinks-dlg">
      <h2>Backlinks</h2>
      <p id="backlinks-count"></p>
      <div id="backlinks-list" class="fmw-records"></div>
      <div class="row">
        <button id="backlinks-close">Close</button>
      </div>
    </dialog>

    <dialog id="outline-dlg">
      <h2>Outline</h2>
      <p id="outline-count"></p>
      <div id="outline-list" class="fmw-records"></div>
      <div class="row">
        <button id="outline-close">Close</button>
      </div>
    </dialog>

    <script type="module">
      import {mark, perfOn, time, timeAsync} from '/ui/perf.js';
      import {api, apiJson, esc, getToken, showAuthDialog} from '/ui/api.js';

      const $ = sel => document.querySelector(sel);
      const path = new URLSearchParams(location.search).get('path');
      const encodePath = p => p.split('/').map(encodeURIComponent).join('/');
      const editHref = (extra = '') => `/ui/edit.html?path=${encodeURIComponent(path)}${extra}`;

      const showError = msg => {
        $('#err').textContent = msg;
        $('#err').hidden = false;
      };

      // load -------------------------------------------------------------
      const decorate = note => {
        const doc = $('#doc');
        if (note.composed) {
          const folder = path.replace(/\.md$/, '');
          doc.insertAdjacentHTML(
            'afterbegin',
            `<p class="fmw-notice">Composed from the pieces of <a href="/ui/folder.html?path=${encodeURIComponent(folder)}">${esc(folder)}/</a>; edit a piece to change it.</p>`
          );
          return;
        }
        const fm = doc.querySelector('.fm > summary');
        if (fm) {
          fm.insertAdjacentHTML(
            'beforeend',
            `<a class="fmw-pill" href="${editHref('&frontmatter')}" title="Edit the frontmatter">edit</a>`
          );
        }
        const byLine = new Map(note.sections.map(s => [s.line, s]));
        for (const h of doc.querySelectorAll('[data-line]')) {
          const s = byLine.get(Number(h.dataset.line));
          if (!s) continue;
          const extra = `&section=${encodeURIComponent(s.heading)}&n=${s.occurrence}`;
          h.insertAdjacentHTML(
            'beforeend',
            `<a class="fmw-pill" href="${editHref(extra)}" title="Edit this section">edit</a>`
          );
        }
      };

      async function load() {
        if (!path) {
          location.replace('/ui/edit.html');
          return;
        }
        if (!getToken()) {
          showAuthDialog();
          return;
        }
        $('#path').textContent = path;
        document.title = `vault-storage — ${path}`;
        try {
          mark('view: load', path);
          const res = await timeAsync('view: fetch', () =>
            api(`/vault/${encodePath(path)}?render=html`)
          );
          const note = await timeAsync('view: read JSON', () => res.json());
          const fm =
            note.frontmatter === null
              ? ''
              : `<details class="fm"><summary>frontmatter</summary><pre class="frontmatter">${esc(note.frontmatter)}</pre></details>`;
          time(
            'view: insert',
            () => ($('#doc').innerHTML = fm + note.html),
            `${note.html.length} chars`
          );
          time('view: decorate', () => decorate(note), `${note.sections.length} sections`);
          if (perfOn) time('view: forced layout', () => $('#doc').getBoundingClientRect().height);
          $('#edit').href = editHref();
          $('#edit').hidden = note.composed;
          for (const id of ['#outline', '#find-btn']) $(id).hidden = false;
          findIndex = null;
          fetchBacklinks();
          if (!note.composed) noteDrafts(note.sections);
          mark('view: done');
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') {
            showAuthDialog();
            return;
          }
          $('#doc').innerHTML = '';
          showError(`Failed to load ${path}: ${e.message}`);
        }
      }

      // drafts -----------------------------------------------------------
      const draftHref = (unit, sections) => {
        if (unit.kind === 'frontmatter') return editHref('&frontmatter');
        if (unit.kind === 'document') return editHref();
        const known = sections.some(
          s => s.heading === unit.heading && s.occurrence === unit.occurrence
        );
        return known
          ? editHref(`&section=${encodeURIComponent(unit.heading)}&n=${unit.occurrence}`)
          : null;
      };

      const draftName = unit =>
        unit.kind === 'section'
          ? unit.heading
          : unit.kind === 'frontmatter'
            ? 'the frontmatter'
            : 'the whole note';

      // Unsaved edits are kept on the server (D60); a reader should know they are waiting.
      async function noteDrafts(sections) {
        let items;
        try {
          ({items} = await apiJson(`/drafts?path=${encodeURIComponent(path)}`));
        } catch {
          return;
        }
        if (!items.length) return;
        const links = items.map(d => {
          const href = draftHref(d.unit, sections);
          const name = esc(draftName(d.unit));
          return href ? `<a href="${href}">${name}</a>` : `${name} (no longer in the note)`;
        });
        $('#doc').insertAdjacentHTML(
          'afterbegin',
          `<p class="fmw-notice">Unsaved drafts of this note: ${links.join(', ')}.</p>`
        );
      }

      // backlinks --------------------------------------------------------
      let backlinks = [];
      let backlinksTotal = 0;

      async function fetchBacklinks() {
        try {
          const resolved = await apiJson(`/resolve?wikilink=${encodeURIComponent(path)}`);
          const data = await apiJson(`/sections/${resolved.record_id}/backlinks?limit=50`);
          backlinks = data.items ?? [];
          backlinksTotal = data.total ?? backlinks.length;
          $('#backlinks').hidden = backlinksTotal === 0;
          $('#backlinks').textContent = `Backlinks (${backlinksTotal})`;
        } catch {
          // Backlinks are an extra; the note reads fine without them.
        }
      }

      const openBacklinks = () => {
        const shown =
          backlinks.length < backlinksTotal ? ` (showing first ${backlinks.length})` : '';
        $('#backlinks-count').textContent =
          `${backlinksTotal} note${backlinksTotal === 1 ? ' links' : 's link'} to this one${shown}.`;
        $('#backlinks-list').innerHTML = backlinks
          .map(bl => {
            const fr = bl.from_record;
            const title = fr.title || fr.file_path.split('/').pop().replace(/\.md$/, '');
            return `<a href="/ui/note.html?path=${encodeURIComponent(fr.file_path)}"><b>${esc(title)}</b><small>${esc(fr.file_path)} · ${esc(bl.edge?.type ?? 'cites')}</small></a>`;
          })
          .join('');
        $('#backlinks-dlg').showModal();
      };

      // outline ----------------------------------------------------------
      const headings = () => [...$('#doc').querySelectorAll('h1, h2, h3, h4, h5, h6')];

      const openOutline = () => {
        const list = headings();
        $('#outline-count').textContent = list.length
          ? `${list.length} heading${list.length === 1 ? '' : 's'}.`
          : 'No headings in this note.';
        $('#outline-list').innerHTML = list
          .map((h, i) => {
            const level = Number(h.tagName[1]);
            const text = [...h.childNodes]
              .filter(n => !(n.nodeType === 1 && n.classList.contains('fmw-pill')))
              .map(n => n.textContent)
              .join('');
            return `<a href="#" data-index="${i}" style="padding-left: ${(level - 1) * 1.2 + 0.7}rem"><b>${esc(text)}</b><small>H${level}</small></a>`;
          })
          .join('');
        $('#outline-dlg').showModal();
      };

      $('#outline-list').addEventListener('click', e => {
        const item = e.target.closest('a[data-index]');
        if (!item) return;
        e.preventDefault();
        $('#outline-dlg').close();
        headings()[Number(item.dataset.index)]?.scrollIntoView({block: 'start'});
      });

      // find -------------------------------------------------------------
      const HL_ALL = 'vault-find';
      const HL_CUR = 'vault-find-current';
      const supportsHighlight =
        typeof Highlight !== 'undefined' && !!(window.CSS && CSS.highlights);
      const MAX_MATCHES = 5000;
      const find = {matches: [], idx: -1, length: 0, caseSensitive: false};
      let findIndex = null;
      let findTimer = null;

      // One string over every text node, so a match may cross an element boundary.
      const buildIndex = () => {
        const nodes = [];
        const starts = [];
        let text = '';
        let lower = '';
        const walker = document.createTreeWalker($('#doc'), NodeFilter.SHOW_TEXT);
        for (let n = walker.nextNode(); n; n = walker.nextNode()) {
          if (n.parentElement?.closest('.fmw-pill')) continue;
          nodes.push(n);
          starts.push(text.length);
          text += n.data;
          const folded = n.data.toLowerCase();
          // A case fold that changes the length would shift every later offset.
          lower += folded.length === n.data.length ? folded : n.data;
        }
        return {nodes, starts, text, lower};
      };

      const locate = (offset, isEnd) => {
        const {nodes, starts} = findIndex;
        let lo = 0;
        let hi = starts.length - 1;
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          if (isEnd ? starts[mid] < offset : starts[mid] <= offset) lo = mid;
          else hi = mid - 1;
        }
        return [nodes[lo], offset - starts[lo]];
      };

      const rangeOf = start => {
        const r = document.createRange();
        r.setStart(...locate(start, false));
        r.setEnd(...locate(start + find.length, true));
        return r;
      };

      const paint = () => {
        const current = find.idx >= 0 ? rangeOf(find.matches[find.idx]) : null;
        if (supportsHighlight) {
          const all = new Highlight();
          find.matches.forEach((m, i) => {
            if (i !== find.idx) all.add(rangeOf(m));
          });
          const cur = new Highlight();
          cur.priority = 1;
          if (current) cur.add(current);
          CSS.highlights.set(HL_ALL, all);
          CSS.highlights.set(HL_CUR, cur);
        } else if (current) {
          getSelection().removeAllRanges();
          getSelection().addRange(current);
        }
        if (!current) return;
        current.startContainer.parentElement
          .closest('details:not([open])')
          ?.setAttribute('open', '');
        const rect = current.getBoundingClientRect();
        if (rect.top < 70 || rect.bottom > innerHeight) scrollBy(0, rect.top - innerHeight / 3);
      };

      const updateCount = () => {
        const n = find.matches.length;
        const q = $('#find-input').value;
        const more = n === MAX_MATCHES ? '+' : '';
        $('#find-count').textContent = n ? `${find.idx + 1}/${n}${more}` : q ? 'no results' : '';
        $('#find-input').classList.toggle('no-match', !!q && n === 0);
        $('#find-prev').disabled = $('#find-next').disabled = n === 0;
      };

      const search = () => {
        findIndex ??= time('find: index', () => buildIndex());
        const q = $('#find-input').value;
        const needle = find.caseSensitive ? q : q.toLowerCase();
        const hay = find.caseSensitive ? findIndex.text : findIndex.lower;
        find.length = q.length;
        find.matches = [];
        if (q) {
          for (let at = hay.indexOf(needle); at >= 0 && find.matches.length < MAX_MATCHES;) {
            find.matches.push(at);
            at = hay.indexOf(needle, at + needle.length);
          }
        }
        find.idx = find.matches.length ? 0 : -1;
        updateCount();
        paint();
      };

      const step = dir => {
        const n = find.matches.length;
        if (!n) return;
        find.idx = (find.idx + dir + n) % n;
        updateCount();
        paint();
      };

      const openFind = () => {
        $('#find-bar').hidden = false;
        const sel = String(getSelection());
        if (sel && !sel.includes('\n')) $('#find-input').value = sel;
        $('#find-input').focus();
        $('#find-input').select();
        search();
      };

      const closeFind = () => {
        if ($('#find-bar').hidden) return;
        $('#find-bar').hidden = true;
        if (supportsHighlight) {
          CSS.highlights.delete(HL_ALL);
          CSS.highlights.delete(HL_CUR);
        }
      };

      $('#find-input').addEventListener('input', () => {
        clearTimeout(findTimer);
        findTimer = setTimeout(search, 150);
      });
      $('#find-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          step(e.shiftKey ? -1 : 1);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeFind();
        }
      });
      $('#find-prev').addEventListener('click', () => step(-1));
      $('#find-next').addEventListener('click', () => step(1));
      $('#find-close').addEventListener('click', closeFind);
      $('#find-case').addEventListener('click', () => {
        find.caseSensitive = !find.caseSensitive;
        $('#find-case').setAttribute('aria-pressed', String(find.caseSensitive));
        search();
      });
      // Buttons keep focus in the input, so Enter still steps.
      $('#find-bar').addEventListener('mousedown', e => {
        if (e.target.closest('button')) e.preventDefault();
      });

      // wiring -----------------------------------------------------------
      $('#find-btn').addEventListener('click', openFind);
      $('#outline').addEventListener('click', openOutline);
      $('#outline-close').addEventListener('click', () => $('#outline-dlg').close());
      $('#backlinks').addEventListener('click', openBacklinks);
      $('#backlinks-close').addEventListener('click', () => $('#backlinks-dlg').close());
      document.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === 'f' || e.key === 'F')) {
          // Ours, not the browser's: its highlight is unstyled and unreadable in the dark theme.
          if ($('#find-btn').hidden) return;
          e.preventDefault();
          openFind();
        } else if (e.key === 'Escape') {
          closeFind();
        }
      });
      document.addEventListener('token-change', load);

      load();
    </script>
    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/theme.js"></script>
  </body>
</html>

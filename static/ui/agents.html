<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>vault-storage — agents</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font:
          15px/1.5 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: 0.8rem 1rem;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 1.05rem;
        margin: 0;
        font-weight: 600;
      }
      header h1 a {
        color: inherit;
        text-decoration: none;
      }
      header .spacer {
        flex: 1;
      }
      main {
        padding: 1rem;
        max-width: 60rem;
        margin: 0 auto;
      }
      h2 {
        font-size: 1rem;
        margin: 1.4rem 0 0.6rem;
      }
      h2:first-child {
        margin-top: 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.4rem 0.6rem;
        border-bottom: 1px solid var(--line);
        vertical-align: baseline;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      td code,
      .events code {
        font-family: var(--mono);
        font-size: 0.85em;
      }
      .kind-human {
        color: var(--accent);
        font-weight: 600;
      }
      button {
        padding: 0.3rem 0.7rem;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
      }
      button.danger {
        background: var(--bad);
        color: #fff;
        border-color: var(--bad);
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      form.claim {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
        margin: 0.6rem 0 1rem;
      }
      form.claim input {
        padding: 0.35rem 0.6rem;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        border-radius: 4px;
        font: inherit;
        font-size: 0.9rem;
      }
      form.claim input[name='resource'] {
        min-width: 20rem;
        flex: 1;
      }
      .empty {
        color: var(--muted);
        padding: 0.8rem 0;
      }
      .events {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .events li {
        margin: 0.15rem 0;
      }
      .error {
        background: color-mix(in srgb, var(--bad) 12%, var(--bg));
        border: 1px solid var(--bad);
        border-radius: 6px;
        padding: 0.6rem 0.9rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <main>
      <div id="status"></div>

      <h2>Repo leases</h2>
      <form class="claim" id="claim-form">
        <input name="resource" placeholder="repo:github.com/uhop/…" required />
        <input name="holder" placeholder="your name" required value="eugene" />
        <button
          class="primary"
          type="submit"
          title="Claim as a human holder — never preempted, never expires"
        >
          Claim as human
        </button>
      </form>
      <div id="leases"><div class="empty">loading…</div></div>

      <h2>Open handoffs</h2>
      <div id="handoffs"><div class="empty">loading…</div></div>

      <h2>Recent events</h2>
      <ul class="events" id="events"></ul>
    </main>

    <script type="module">
      import {api, apiJson, esc, showAuthDialog} from '/ui/api.js';
      const $ = sel => document.querySelector(sel);

      const showStatus = msg => {
        $('#status').innerHTML = msg ? `<div class="error">${esc(msg)}</div>` : '';
      };

      const fmtSince = iso => {
        const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
        if (s < 90) return `${Math.round(s)}s ago`;
        if (s < 5400) return `${Math.round(s / 60)}m ago`;
        return `${(s / 3600).toFixed(1)}h ago`;
      };
      const fmtBytes = n =>
        n < 1024
          ? `${n} B`
          : n < 1048576
            ? `${(n / 1024).toFixed(1)} KB`
            : `${(n / 1048576).toFixed(1)} MB`;
      const fmtTtl = iso => {
        if (!iso) return '—';
        const s = (Date.parse(iso) - Date.now()) / 1000;
        if (s <= 0) return 'expired';
        if (s < 5400) return `${Math.round(s / 60)}m left`;
        return `${(s / 3600).toFixed(1)}h left`;
      };

      const renderLeases = items => {
        if (items.length === 0) {
          $('#leases').innerHTML =
            `<div class="empty">No leases held. Every repo is claimable (clean checkouts only for side claims).</div>`;
          return;
        }
        const rows = items
          .map(
            l => `
          <tr>
            <td><code>${esc(l.resource)}</code></td>
            <td class="${l.holder_kind === 'human' ? 'kind-human' : ''}">${esc(l.holder)}
              ${l.holder_kind === 'human' ? '(human)' : `(${esc(l.priority ?? 'agent')})`}</td>
            <td title="${esc(l.claimed_at)}">${fmtSince(l.claimed_at)}</td>
            <td>${fmtTtl(l.expires_at)}</td>
            <td>${l.attestation ? `<code>${esc(l.attestation)}</code>` : '—'}</td>
            <td><button class="danger" data-release="${esc(l.resource)}" data-holder="${esc(l.holder)}">
              release</button></td>
          </tr>`
          )
          .join('');
        $('#leases').innerHTML = `
          <table>
            <thead><tr>
              <th>resource</th><th>holder</th><th>held</th><th>expires</th><th>attestation</th><th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      };

      const renderHandoffs = items => {
        const inFlight = items.filter(h => ['open', 'claimed', 'returned'].includes(h.status));
        if (inFlight.length === 0) {
          $('#handoffs').innerHTML =
            `<div class="empty">No handoffs in flight. Resolved ones live in each project's handoff-archive.md.</div>`;
          return;
        }
        const rows = inFlight
          .map(
            h => `
          <tr title="${esc(h.body.split('\n', 1)[0])}">
            <td><code title="${esc(h.id)}">${esc(h.id.slice(-8))}</code></td>
            <td><code>${esc(h.to)}</code></td>
            <td>${esc(h.kind)}</td>
            <td>${esc(h.status)}${h.status === 'claimed' ? ` by ${esc(h.claimed_by)}` : ''}</td>
            <td>${esc(h.from.host)}/${esc(h.from.session)}</td>
            <td>${h.ref ? `<code>${esc(h.ref.type)}: ${esc(h.ref.value)}</code>` : '—'}</td>
            <td>${
              h.artifact
                ? `<button data-artifact="${esc(h.id)}" data-ext="${esc(h.artifact.ext)}"
                     title="sha256 ${esc(h.artifact.sha256)}">${esc(h.artifact.ext)} · ${fmtBytes(
                       h.artifact.bytes
                     )}</button>`
                : '—'
            }</td>
            <td title="${esc(h.updated)}">${fmtSince(h.updated)}</td>
            <td>${h.notes.length > 0 ? h.notes.length : '—'}</td>
          </tr>`
          )
          .join('');
        $('#handoffs').innerHTML = `
          <table>
            <thead><tr>
              <th>id</th><th>to</th><th>kind</th><th>status</th><th>from</th><th>ref</th><th>artifact</th><th>touched</th><th>notes</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      };

      const renderEvents = items => {
        $('#events').innerHTML =
          items.length === 0
            ? '<li class="empty">No events since the last server start.</li>'
            : items
                .map(
                  e =>
                    `<li>${esc(e.at.replace('T', ' ').slice(0, 19))} — <b>${esc(e.event)}</b>
                     <code>${esc(e.resource ?? e.handoff_id)}</code>${
                       (e.holder ?? e.actor) ? ` by ${esc(e.holder ?? e.actor)}` : ''
                     }${e.detail ? ` <code>${esc(e.detail)}</code>` : ''}</li>`
                )
                .join('');
      };

      const handleErr = e => {
        if (e.message === 'unauthorized' || e.message === 'no-token') {
          showAuthDialog();
          return;
        }
        showStatus(e.message);
      };

      const refresh = async () => {
        showStatus('');
        try {
          const [leases, handoffs, leaseEvents, handoffEvents] = await Promise.all([
            apiJson('/leases'),
            apiJson('/handoffs'),
            apiJson('/leases/events?limit=50'),
            apiJson('/handoffs/events?limit=50')
          ]);
          renderLeases(leases.items);
          renderHandoffs(handoffs.items);
          renderEvents(
            [...leaseEvents.items, ...handoffEvents.items]
              .sort((a, b) => (a.at < b.at ? 1 : -1))
              .slice(0, 50)
          );
        } catch (e) {
          handleErr(e);
        }
      };

      $('#claim-form').addEventListener('submit', async ev => {
        ev.preventDefault();
        const f = ev.target.elements;
        try {
          await api('/leases/claim', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              resource: f.resource.value.trim(),
              holder: f.holder.value.trim(),
              kind: 'human'
            })
          });
          f.resource.value = '';
          await refresh();
        } catch (e) {
          handleErr(e);
        }
      });

      // Delegated: the tables re-render every refresh, the containers don't.
      $('#leases').addEventListener('click', async e => {
        const btn = e.target.closest('[data-release]');
        if (!btn) return;
        if (!confirm(`Force-release ${btn.dataset.release} from ${btn.dataset.holder}?`)) return;
        try {
          await api('/leases/release', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              resource: btn.dataset.release,
              holder: $('#claim-form').elements.holder.value || 'operator',
              force: true
            })
          });
          await refresh();
        } catch (err) {
          handleErr(err);
        }
      });

      // The artifact needs the bearer token, so it cannot be a plain link —
      // fetch it authenticated and hand the browser a blob to save.
      $('#handoffs').addEventListener('click', async e => {
        const btn = e.target.closest('[data-artifact]');
        if (!btn) return;
        try {
          const res = await api(`/handoffs/${encodeURIComponent(btn.dataset.artifact)}/artifact`);
          const url = URL.createObjectURL(await res.blob());
          const a = document.createElement('a');
          a.href = url;
          a.download = `${btn.dataset.artifact}.${btn.dataset.ext}`;
          a.click();
          URL.revokeObjectURL(url);
        } catch (err) {
          handleErr(err);
        }
      });

      document.addEventListener('token-change', refresh);

      refresh();
      setInterval(refresh, 30_000);
    </script>
    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/theme.js"></script>
  </body>
</html>

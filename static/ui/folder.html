<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
    </script>
    <script>
      // api() adopts these by exact URL: keep them in step with the page's own first requests.
      (() => {
        const token = localStorage.getItem('vault.token');
        if (!token) return;
        const path = (new URLSearchParams(location.search).get('path') ?? '')
          .replace(/^\/+|\/+$/g, '')
          .replace(/\/+/g, '/');
        const urls = [
          `/maintenance/folder-listing${path === '' ? '' : `?path=${encodeURIComponent(path)}`}`
        ];
        const early = (window.__early ??= new Map());
        for (const url of urls) {
          const res = fetch(url, {headers: {Authorization: `Bearer ${token}`}});
          res.catch(() => {});
          early.set(url, res);
        }
      })();
    </script>
    <title>vault-storage — browse</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      main {
        max-width: 64rem;
      }
      .crumbs {
        font-family: var(--mono);
        font-size: 0.9rem;
        margin: 0 0 1rem;
        color: var(--muted);
      }
      .crumbs a {
        color: var(--accent);
        text-decoration: none;
      }
      .crumbs a:hover {
        text-decoration: underline;
      }
      .crumbs .sep {
        margin: 0 0.35rem;
      }
      .crumbs .here {
        color: var(--fg);
      }
      section + section {
        margin-top: 1.2rem;
      }
      .badges {
        display: flex;
        gap: 0.4rem;
      }
      .badges .type {
        padding: 0 0.35rem;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .empty {
        padding: 1rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
    </style>
  </head>
  <body class="fmw">
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <main>
      <p id="crumbs" class="crumbs"></p>
      <div id="content">
        <div class="empty"><span class="spinner"></span> loading…</div>
      </div>
    </main>

    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/theme.js"></script>
    <script type="module">
      import {apiJson, esc, getToken, showAuthDialog} from '/ui/api.js';
      const $ = sel => document.querySelector(sel);

      const currentPath = () => {
        const p = new URLSearchParams(location.search).get('path') ?? '';
        return p.replace(/^\/+|\/+$/g, '').replace(/\/+/g, '/');
      };

      const folderHref = path =>
        path === '' ? '/ui/folder.html' : `/ui/folder.html?path=${encodeURIComponent(path)}`;

      const renderCrumbs = path => {
        const segs = path === '' ? [] : path.split('/');
        const parts = [`<a href="${folderHref('')}">vault</a>`];
        let acc = '';
        for (let i = 0; i < segs.length; i++) {
          acc = acc === '' ? segs[i] : `${acc}/${segs[i]}`;
          const last = i === segs.length - 1;
          if (last) {
            parts.push(`<span class="here">${esc(segs[i])}</span>`);
          } else {
            parts.push(`<a href="${folderHref(acc)}">${esc(segs[i])}</a>`);
          }
        }
        $('#crumbs').innerHTML = parts.join('<span class="sep">/</span>');
      };

      const renderSubfolders = (parentPath, subfolders) => {
        if (subfolders.length === 0) return '';
        const items = subfolders
          .map(name => {
            const full = parentPath === '' ? name : `${parentPath}/${name}`;
            return `
      <a href="${folderHref(full)}"><i>📁</i><b>${esc(name)}/</b></a>
    `;
          })
          .join('');
        return `
    <section>
      <h2 class="fmw-eyebrow">Folders <span class="fmw-count">${subfolders.length}</span></h2>
      <div class="fmw-records boxed rows">${items}</div>
    </section>
  `;
      };

      const renderFiles = files => {
        if (files.length === 0) return '';
        const items = files
          .map(f => {
            const filename = f.path.split('/').pop();
            const display = f.title ? esc(f.title) : `<i>${esc(filename ?? f.path)}</i>`;
            const updated = f.updated ? f.updated.slice(0, 10) : '';
            return `
      <a href="/ui/note.html?path=${encodeURIComponent(f.path)}">
        <i>📄</i>
        <b>${display}</b>
        <small class="badges">
          <span class="type">${esc(f.type)}</span>
          ${f.status && f.status !== 'active' ? `<span class="type">${esc(f.status)}</span>` : ''}
        </small>
        <small>${esc(updated)}</small>
      </a>
    `;
          })
          .join('');
        return `
    <section>
      <h2 class="fmw-eyebrow">Files <span class="fmw-count">${files.length}</span></h2>
      <div class="fmw-records boxed rows">${items}</div>
    </section>
  `;
      };

      const render = data => {
        renderCrumbs(data.path);
        const sub = renderSubfolders(data.path, data.subfolders ?? []);
        const files = renderFiles(data.files ?? []);
        if (!sub && !files) {
          $('#content').innerHTML = '<div class="empty">Nothing in this folder.</div>';
          return;
        }
        $('#content').innerHTML = sub + files;
        document.title =
          data.path === '' ? 'vault-storage — browse' : `vault-storage — ${data.path}`;
      };

      async function refresh() {
        if (!getToken()) {
          $('#content').innerHTML =
            '<div class="err">No API token set. Open settings to paste one.</div>';
          return;
        }
        const path = currentPath();
        $('#content').innerHTML = '<div class="empty"><span class="spinner"></span> loading…</div>';
        try {
          const params = path === '' ? '' : `?path=${encodeURIComponent(path)}`;
          const data = await apiJson(`/maintenance/folder-listing${params}`);
          render(data);
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') {
            $('#content').innerHTML =
              '<div class="err">Unauthorized. Check the token in settings.</div>';
          } else {
            $('#content').innerHTML = `<div class="err">${esc(e.message)}</div>`;
          }
        }
      }

      window.addEventListener('popstate', refresh);

      document.addEventListener('token-change', refresh);

      refresh();
    </script>
  </body>
</html>

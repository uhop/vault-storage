<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const t = localStorage.getItem('vault.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>vault-storage — search</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <style>
      .search-bar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .search-bar input[type='search'] {
        flex: 1;
        min-width: 12rem;
        padding: 0.55rem 0.7rem;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--card);
        color: var(--fg);
      }
      .modes {
        display: flex;
        gap: 0.8rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .modes label {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        cursor: pointer;
      }
      button {
        padding: 0.55rem 0.9rem;
      }
      .recents {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-top: 0.6rem;
      }
      .recents .fmw-pill {
        font-family: var(--mono);
      }
      .results {
        display: grid;
        gap: 0.5rem;
        margin-top: 1.2rem;
      }
      .facets {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem;
        margin-top: 0.9rem;
        font-size: var(--text-s);
      }
      .facets[hidden] {
        display: none;
      }
      .facets .total,
      .facets .others {
        color: var(--muted);
        margin-right: 0.4rem;
      }
      .facets .facet,
      .facets .facet-clear {
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        font-size: var(--text-s);
      }
      .facets .facet .type {
        font-family: var(--mono);
      }
      .facets .facet .count {
        color: var(--muted);
      }
      .facets .facet[data-state='has'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg, #fff);
      }
      .facets .facet[data-state='has'] .count {
        color: inherit;
      }
      .facets .facet[data-state='lacks'] {
        border-color: var(--bad);
        color: var(--bad);
      }
      .facets .facet[data-state='lacks'] .type {
        text-decoration: line-through;
      }
      #results .edges {
        display: flex;
        flex-wrap: wrap;
        gap: 0.2rem 0.8rem;
        margin-top: 0.35rem;
        color: var(--muted);
        font-size: var(--text-s);
      }
      #results .edges .type {
        font-family: var(--mono);
      }
      #results .edges .match {
        color: var(--accent);
        font-weight: 600;
      }
      #results .filename {
        font-family: var(--mono);
        font-size: 0.9rem;
        color: var(--accent);
        cursor: pointer;
        word-break: break-all;
      }
      #results .filename:hover {
        text-decoration: underline;
      }
      #results .snippets {
        margin-top: 0.4rem;
        font-size: 0.85rem;
        color: var(--muted);
        font-family: var(--mono);
      }
      #results .snippets div {
        padding: 0.15rem 0;
        word-break: break-word;
      }
      #results .snippets mark {
        background: var(--hl);
        color: inherit;
        padding: 0 0.1em;
        border-radius: 2px;
      }
    </style>
  </head>
  <body class="fmw">
    <header>
      <h1><a href="/ui/">vault-storage</a></h1>
      <vault-nav></vault-nav>
      <div class="spacer"></div>
      <div id="theme-toggle"></div>
      <vault-settings></vault-settings>
    </header>
    <main id="root">
      <div class="search-bar">
        <input
          type="search"
          id="q"
          placeholder="Search the vault…"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="modes">
          <label><input type="radio" name="mode" value="lexical" checked /> lexical</label>
          <label><input type="radio" name="mode" value="semantic" /> semantic</label>
        </div>
        <button id="go" class="primary">Search</button>
      </div>
      <div class="recents" id="recents"></div>
      <div class="facets" id="facets" hidden></div>
      <div class="results" id="results"></div>
    </main>
    <div class="footer" id="footer"></div>

    <script type="module">
      import {api, apiJson, esc, getToken, showAuthDialog} from '/ui/api.js';
      import {
        cycle,
        edgeParam,
        facetRows,
        parseEdgeParam,
        renderEdgeSummary,
        renderFacets,
        summarizeEdges
      } from '/ui/search-edges.js';
      const RECENT_KEY = 'vault.recent-searches';
      const RECENT_MAX = 8;
      const $ = sel => document.querySelector(sel);

      const getRecents = () => {
        try {
          return JSON.parse(localStorage.getItem(RECENT_KEY) ?? '[]');
        } catch {
          return [];
        }
      };
      const pushRecent = q => {
        const r = [q, ...getRecents().filter(x => x !== q)].slice(0, RECENT_MAX);
        localStorage.setItem(RECENT_KEY, JSON.stringify(r));
        renderRecents();
      };
      const renderRecents = () => {
        const r = getRecents();
        $('#recents').innerHTML =
          r.length === 0
            ? ''
            : r.map(q => `<button class="fmw-pill" data-q="${esc(q)}">${esc(q)}</button>`).join('');
      };

      const highlightSnippet = (context, match) => {
        // The /search/simple/ response gives match start/end as offsets into the
        // FULL body, not into context. The context is a substring around the match;
        // we don't know its absolute position. Best-effort: bold-highlight the
        // first occurrence of the matched substring inside the context.
        if (!context) return '';
        const ctx = String(context);
        // Try to find the match by reading the body offset range from the original
        // body. Without that, we have no reliable highlight target. The /vault-search
        // skill notes that matches[].context is short and typically contains the
        // match — render plain, no highlight, until we add a server-side highlighter.
        return esc(ctx);
      };

      // A lexical score is a relevance, bm25 with a title boost, not a count of matches.
      const fmtScore = score => `score ${Number(score).toFixed(3)}`;

      const renderResults = results => {
        if (!Array.isArray(results) || results.length === 0) {
          $('#results').innerHTML = '<div class="empty">No matches.</div>';
          return;
        }
        $('#results').innerHTML = results
          .map((r, i) => {
            const snippets = (r.matches ?? [])
              .slice(0, 3)
              .map(m => {
                const ctx = highlightSnippet(m.context, m.match);
                return `<div>… ${ctx} …</div>`;
              })
              .join('');
            const path = encodeURIComponent(r.filename);
            const edges = renderEdgeSummary(summarizeEdges(r.edges), picks, esc);
            return `
      <div class="fmw-card" data-idx="${i}">
        <header>
          <span class="filename" data-path="${esc(r.filename)}">${esc(r.filename)}</span>
          <a class="fmw-pill" href="/ui/note.html?path=${path}" title="View rendered">view</a>
          <a class="fmw-pill" href="/ui/edit.html?path=${path}" title="Edit">edit</a>
          <small>${fmtScore(r.score)}</small>
        </header>
        ${edges ? `<div class="edges">${edges}</div>` : ''}
        ${snippets ? `<div class="snippets">${snippets}</div>` : ''}
        <pre id="body-${i}"></pre>
      </div>
    `;
          })
          .join('');
      };

      // The URL is the state: q, mode, and edge, the search route's conditions.
      const initial = new URLSearchParams(location.search);
      let {picks, extra} = parseEdgeParam(initial.get('edge'));
      let facets = null;
      let seq = 0;

      const writeState = (q, mode) => {
        const params = new URLSearchParams({q});
        if (mode === 'semantic') params.set('mode', 'semantic');
        const edge = edgeParam(picks, extra);
        if (edge) params.set('edge', edge);
        history.replaceState(null, '', `?${params}`);
      };

      const showFacets = () => {
        $('#facets').hidden = !facets;
        if (!facets) return;
        $('#facets').innerHTML = renderFacets(
          facetRows(facets.edges, picks),
          picks,
          extra,
          facets.total,
          esc
        );
      };

      const search = async () => {
        const q = $('#q').value.trim();
        if (!q) return;
        const mode = document.querySelector('input[name=mode]:checked').value;
        const my = ++seq;
        writeState(q, mode);
        $('#results').innerHTML =
          '<div class="empty"><span class="spinner"></span> searching…</div>';
        try {
          const params = new URLSearchParams({query: q, edges: '1'});
          if (mode === 'semantic') params.set('mode', 'semantic');
          const edge = edgeParam(picks, extra);
          if (edge) params.set('edge', edge);
          const counts = new URLSearchParams({query: q});
          if (mode === 'semantic') counts.set('mode', 'semantic');
          const key = counts.toString();
          const [data, counted] = await Promise.all([
            apiJson(`/search/simple/?${params}`, {method: 'POST'}),
            facets?.key === key
              ? facets
              : apiJson(`/search/facets?${counts}`, {method: 'POST'}).then(f => ({...f, key}))
          ]);
          if (my !== seq) return;
          facets = counted;
          pushRecent(q);
          showFacets();
          renderResults(data);
        } catch (e) {
          if (e.message === 'unauthorized' || e.message === 'no-token') {
            showAuthDialog();
            return;
          }
          $('#results').innerHTML = `<div class="err">Search failed: ${esc(e.message)}</div>`;
        }
      };

      const expandResult = async (card, path) => {
        if (card.classList.contains('open')) {
          card.classList.remove('open');
          return;
        }
        card.classList.add('open');
        const body = card.querySelector('pre');
        if (body.dataset.loaded === '1') return;
        body.textContent = 'loading…';
        try {
          const encoded = path.split('/').map(encodeURIComponent).join('/');
          const res = await api(`/vault/${encoded}`);
          body.textContent = await res.text();
          body.dataset.loaded = '1';
        } catch (e) {
          body.textContent = `failed: ${e.message}`;
        }
      };

      document.addEventListener('token-change', () => {
        if ($('#q').value.trim()) search();
      });
      $('#go').addEventListener('click', search);
      $('#q').addEventListener('keydown', e => {
        if (e.key === 'Enter') search();
      });

      // The model loads on first use (about 35 s after an idle release): start it while the query is typed.
      let warmed = false;
      document.addEventListener('change', e => {
        if (warmed || e.target.name !== 'mode' || e.target.value !== 'semantic') return;
        warmed = true;
        api('/maintenance/warm-embedder', {method: 'POST'}).catch(() => {});
      });

      document.addEventListener('click', e => {
        const facet = e.target.closest('button.facet');
        if (facet) {
          const next = cycle(picks.get(facet.dataset.key));
          if (next === 'off') picks.delete(facet.dataset.key);
          else picks.set(facet.dataset.key, next);
          search();
          return;
        }
        if (e.target.closest('button.facet-clear')) {
          picks = new Map();
          extra = [];
          search();
          return;
        }
        const chip = e.target.closest('button.fmw-pill');
        if (chip) {
          $('#q').value = chip.dataset.q;
          search();
          return;
        }
        const fname = e.target.closest('.filename');
        if (fname) {
          const card = fname.closest('.fmw-card');
          expandResult(card, fname.dataset.path);
        }
      });

      if (!getToken()) showAuthDialog();
      renderRecents();
      if (initial.get('mode') === 'semantic') {
        document.querySelector('input[name=mode][value=semantic]').checked = true;
      }
      $('#q').value = initial.get('q') ?? '';
      $('#q').focus();
      if ($('#q').value && getToken()) search();
    </script>
    <script type="module" src="/ui/components/vault-settings.js"></script>
    <script type="module" src="/ui/components/vault-nav.js"></script>
    <script type="module" src="/ui/theme.js"></script>
  </body>
</html>
